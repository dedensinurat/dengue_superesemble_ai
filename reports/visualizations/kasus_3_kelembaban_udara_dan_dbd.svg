<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" style="background: #090d16; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="rhCleanGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <filter id="cardShadow3" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Clean Background -->
  <rect width="1280" height="720" fill="#090d16"/>

  <!-- Subtle Header Divider -->
  <line x1="50" y1="82" x2="1230" y2="82" stroke="#1e293b" stroke-width="1"/>

  <!-- ================= TOP HEADER ================= -->
  <g transform="translate(50, 24)">
    <text x="0" y="14" fill="#10b981" font-size="11" font-weight="700" letter-spacing="1">DENGUECAST • ANALISIS VARIABEL UTAMA (STUDI KASUS 3)</text>
    <text x="0" y="40" fill="#ffffff" font-size="22" font-weight="700">Kelembaban Relatif (RH) &amp; Perpanjangan Masa Hidup Vektor Nyamuk</text>
    <text x="0" y="58" fill="#94a3b8" font-size="12">Bukti Empiris: Mengapa Wilayah Pesisir Tropis (Kalimantan Timur &amp; Kep. Riau) Mengalami Penularan Sepanjang Tahun</text>

    <!-- Clean Metric Pill Right -->
    <g transform="translate(1000, 2)">
      <rect x="0" y="0" width="180" height="42" rx="8" fill="#131d31" stroke="#334155" stroke-width="1"/>
      <text x="90" y="18" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle">KORELASI LAG-1 DENGAN DBD</text>
      <text x="90" y="34" fill="#10b981" font-size="13" font-weight="800" text-anchor="middle">r = +0.44 (Signifikan)</text>
    </g>
  </g>

  <!-- ================= LEFT COLUMN: EMPIRICAL VECTOR SURVIVAL CHART ================= -->
  <g transform="translate(50, 98)">
    <rect x="0" y="0" width="580" height="525" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" filter="url(#cardShadow3)"/>

    <text x="24" y="34" fill="#ffffff" font-size="14" font-weight="700">Dinamika Survival Nyamuk Betina vs Kelembaban Udara</text>
    <text x="24" y="52" fill="#94a3b8" font-size="11">Data entomologi laboratorium &amp; surveilans lapangan Kemenkes RI</text>

    <!-- Legend -->
    <g transform="translate(24, 72)">
      <line x1="0" y1="8" x2="20" y2="8" stroke="#10b981" stroke-width="3"/>
      <circle cx="10" cy="8" r="4" fill="#10b981"/>
      <text x="26" y="12" fill="#e2e8f0" font-size="11">Masa Hidup Nyamuk (Hari)</text>

      <line x1="220" y1="8" x2="240" y2="8" stroke="#f43f5e" stroke-width="1.8" stroke-dasharray="3 2"/>
      <text x="248" y="12" fill="#fca5a5" font-size="11">Batas Kritis Inkubasi Virus (~10 Hari)</text>
    </g>

    <!-- CHART AREA (Width: 490, Height: 210, Baseline Y: 210) -->
    <!-- X: RH 40% to 100%, Y: 0 to 40 Hari (Scale = 200px / 40 hari = 5 px/hari) -->
    <g transform="translate(50, 105)">
      <!-- Grid lines -->
      <line x1="0" y1="210" x2="480" y2="210" stroke="#334155" stroke-width="1"/>
      <line x1="0" y1="160" x2="480" y2="160" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="0" y1="110" x2="480" y2="110" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="0" y1="60" x2="480" y2="60" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="0" y1="10" x2="480" y2="10" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>

      <!-- Y-Axis Labels -->
      <text x="-10" y="214" fill="#64748b" font-size="9.5" text-anchor="end">0</text>
      <text x="-10" y="164" fill="#f87171" font-size="9.5" font-weight="700" text-anchor="end">10 Hari</text>
      <text x="-10" y="114" fill="#64748b" font-size="9.5" text-anchor="end">20 Hari</text>
      <text x="-10" y="64" fill="#64748b" font-size="9.5" text-anchor="end">30 Hari</text>
      <text x="-10" y="14" fill="#10b981" font-size="9.5" font-weight="700" text-anchor="end">40 Hari</text>

      <!-- X-Axis Labels (RH %) -->
      <text x="30" y="228" fill="#64748b" font-size="10" text-anchor="middle">45%</text>
      <text x="110" y="228" fill="#64748b" font-size="10" text-anchor="middle">55%</text>
      <text x="190" y="228" fill="#64748b" font-size="10" text-anchor="middle">65%</text>
      <text x="270" y="228" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">75% (Tropis)</text>
      <text x="350" y="228" fill="#10b981" font-size="10.5" font-weight="800" text-anchor="middle">82% (Kaltim)</text>
      <text x="430" y="228" fill="#10b981" font-size="10.5" font-weight="800" text-anchor="middle">88% (Kepri)</text>

      <!-- CRITICAL EIP THRESHOLD LINE (10 HARI -> Y = 160) -->
      <line x1="0" y1="160" x2="480" y2="160" stroke="#f43f5e" stroke-width="1.8" stroke-dasharray="4 3"/>
      <rect x="15" y="144" width="150" height="16" rx="3" fill="#881337"/>
      <text x="90" y="156" fill="#fecdd3" font-size="8.5" font-weight="700" text-anchor="middle">Ambang Kritis EIP (~10 Hari)</text>

      <!-- SURVIVAL CURVE (Clean exponential) -->
      <!-- 45%: 6 hr (y=180), 55%: 9 hr (y=165), 65%: 14 hr (y=140), 75%: 22 hr (y=100), 82%: 31 hr (y=55), 88%: 36 hr (y=30) -->
      <path d="M 30 180 Q 110 170 190 140 T 270 100 T 350 55 T 430 30"
            fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>

      <!-- Dots & Callout Values -->
      <circle cx="30" cy="180" r="4" fill="#64748b"/>
      <circle cx="110" cy="165" r="4.5" fill="#f43f5e"/>

      <!-- Label Below EIP -->
      <text x="110" y="185" fill="#f87171" font-size="8.5" font-weight="600" text-anchor="middle">Nyamuk mati &lt; 10 hr</text>

      <circle cx="190" cy="140" r="4" fill="#64748b"/>
      <circle cx="270" cy="100" r="4.5" fill="#10b981"/>

      <!-- Highlight Kaltim (82% RH -> 31 Hari) -->
      <circle cx="350" cy="55" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
      <rect x="315" y="28" width="70" height="18" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="350" y="41" fill="#a7f3d0" font-size="9.5" font-weight="800" text-anchor="middle">31 Hari Hidup</text>

      <!-- Highlight Kepri (88% RH -> 36 Hari) -->
      <circle cx="430" cy="30" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
      <rect x="395" y="4" width="70" height="18" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="430" y="17" fill="#a7f3d0" font-size="9.5" font-weight="800" text-anchor="middle">36 Hari Hidup</text>
    </g>

    <!-- CLEAN BOTTOM EXPLANATION BOX -->
    <g transform="translate(24, 385)">
      <rect x="0" y="0" width="532" height="115" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="22" fill="#10b981" font-size="11" font-weight="700">Fakta Kunci Kurva di Atas:</text>
      <text x="16" y="42" fill="#e2e8f0" font-size="11">• Pada kelembaban kering (&lt;60%), nyamuk mati sebelum virus matang <tspan fill="#f87171" font-weight="700">(rantai transmisi putus)</tspan>.</text>
      <text x="16" y="62" fill="#e2e8f0" font-size="11">• Pada RH &gt; 80% (Kaltim &amp; Kepri), usia nyamuk melonjak hingga <tspan fill="#10b981" font-weight="700">30 s/d 36 hari</tspan>.</text>
      <text x="16" y="86" fill="#cbd5e1" font-size="10.5">Dampak: Nyamuk memiliki <tspan fill="#ffffff" font-weight="700">jendela aktif menular selama 20+ hari</tspan>, sanggup menulari 3–5 orang dalam 1 klaster.</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: FIELD DYNAMICS & DATA FORMULATION ================= -->
  <g transform="translate(650, 98)">
    <rect x="0" y="0" width="580" height="525" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" filter="url(#cardShadow3)"/>

    <text x="24" y="34" fill="#ffffff" font-size="14" font-weight="700">Dinamika Lapangan &amp; Solusi Pemodelan Spasial</text>
    <text x="24" y="52" fill="#94a3b8" font-size="11">Karakteristik transmisi DBD di daerah lembab pesisir tropis</text>

    <!-- 3 STEP CLEAN CARDS -->
    <g transform="translate(24, 70)">
      <!-- STEP 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="532" height="85" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
        <circle cx="24" cy="24" r="12" fill="#1e293b"/>
        <text x="24" y="28" fill="#10b981" font-size="11" font-weight="800" text-anchor="middle">1</text>
        <text x="46" y="24" fill="#ffffff" font-size="12" font-weight="700">Transmisi Endemis Sepanjang Tahun (Year-Round)</text>
        <text x="46" y="44" fill="#94a3b8" font-size="11">Di Kalimantan Timur, kelembaban udara hampir tidak pernah turun di bawah 80%.</text>
        <text x="46" y="60" fill="#e2e8f0" font-size="11">Akibatnya, kasus tidak pernah nol di musim kemarau dan fasilitas faskes terus menerima pasien.</text>
      </g>

      <!-- STEP 2 -->
      <g transform="translate(0, 97)">
        <rect x="0" y="0" width="532" height="85" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
        <circle cx="24" cy="24" r="12" fill="#1e293b"/>
        <text x="24" y="28" fill="#10b981" font-size="11" font-weight="800" text-anchor="middle">2</text>
        <text x="46" y="24" fill="#ffffff" font-size="12" font-weight="700">Mikro-Habitat Nyamuk di Dalam Ruangan (Indoor)</text>
        <text x="46" y="44" fill="#94a3b8" font-size="11">Nyamuk bersembunyi pada pakaian tergantung dan gorden yang sejuk dan lembab,</text>
        <text x="46" y="60" fill="#94a3b8" font-size="11">sehingga fogging luar ruangan sering tidak menjangkau sarang istirahat nyamuk.</text>
      </g>

      <!-- STEP 3 -->
      <g transform="translate(0, 194)">
        <rect x="0" y="0" width="532" height="85" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
        <circle cx="24" cy="24" r="12" fill="#10b981" font-size="11" font-weight="800" text-anchor="middle">3</circle>
        <text x="24" y="28" fill="#10b981" font-size="11" font-weight="800" text-anchor="middle">3</text>
        <text x="46" y="24" fill="#ffffff" font-size="12" font-weight="700">Formula Rekayasa Data DengueCast (Tetens ERA5)</text>
        <text x="46" y="44" fill="#94a3b8" font-size="11">Karena banyak sensor RH BMKG di daerah terpencil rusak, DengueCast merekonstruksi</text>
        <text x="46" y="60" fill="#cbd5e1" font-size="11">RH secara presisi dari suhu (T) dan titik embun (Td) ERA5-Land tanpa missing value.</text>
      </g>
    </g>

    <!-- ACTIONABLE HEALTHCARE POLICY BOX -->
    <g transform="translate(24, 385)">
      <rect x="0" y="0" width="532" height="115" rx="8" fill="#131d31" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" fill="#10b981" font-size="11" font-weight="700">Implikasi Program Promotif-Preventif BPJS &amp; Puskesmas:</text>
      <text x="16" y="44" fill="#e2e8f0" font-size="11">1. <tspan font-weight="700" fill="#ffffff">Surveilans Tanpa Henti:</tspan> Di provinsi ber-RH tinggi, program kewaspadaan DBD tidak boleh</text>
      <text x="32" y="60" fill="#94a3b8" font-size="10.5">dikendurkan saat musim kemarau karena penularan aktif berlangsung terus-menerus.</text>
      <text x="16" y="80" fill="#e2e8f0" font-size="11">2. <tspan font-weight="700" fill="#ffffff">Edukasi Sanitasi Dalam Rumah:</tspan> Kebiasaan menggantung baju bekas pakai di kamar harus</text>
      <text x="32" y="96" fill="#94a3b8" font-size="10.5">dihentikan karena menjadi tempat berlindung utama nyamuk infektif berumur panjang.</text>
    </g>
  </g>

  <!-- ================= BOTTOM STATUS FOOTER ================= -->
  <g transform="translate(50, 638)">
    <rect x="0" y="0" width="1180" height="52" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="22" fill="#10b981" font-size="11" font-weight="700">Peran Kelembaban Relatif dalam Model DengueCast:</text>
    <text x="20" y="39" fill="#94a3b8" font-size="11">Variabel RH berfungsi sebagai <tspan fill="#e2e8f0" font-weight="600">penjaga lantai dasar probabilitas (baseline probability floor)</tspan>, memastikan model membedakan provinsi dengan transmisi tahunan stabil dari provinsi bertipe musiman tajam.</text>
  </g>
</svg>
