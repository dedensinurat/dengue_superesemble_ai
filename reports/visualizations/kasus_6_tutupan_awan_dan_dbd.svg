<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" style="background: #090d16; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Bar Gradient -->
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <linearGradient id="uvLineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <filter id="cardShadow6" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Clean Background -->
  <rect width="1280" height="720" fill="#090d16"/>

  <!-- Subtle Header Divider -->
  <line x1="50" y1="82" x2="1230" y2="82" stroke="#1e293b" stroke-width="1"/>

  <!-- Top Header -->
  <g transform="translate(50, 24)">
    <text x="0" y="14" fill="#818cf8" font-size="11" font-weight="700" letter-spacing="1">DENGUECAST • ANALISIS VARIABEL PENDUKUNG (STUDI KASUS 6)</text>
    <text x="0" y="40" fill="#ffffff" font-size="22" font-weight="700">Tutupan Awan, Penurunan Radiasi UV &amp; Aktivitas Menggigit Nyamuk</text>
    <text x="0" y="58" fill="#94a3b8" font-size="12">Bukti Empiris: Mengapa Hari Berawan Memicu Lonjakan Aktivitas Gigitan Diurnal Aedes aegypti di Luar Ruangan</text>

    <!-- Clean Metric Pill Right -->
    <g transform="translate(1000, 2)">
      <rect x="0" y="0" width="180" height="42" rx="8" fill="#131d31" stroke="#334155" stroke-width="1"/>
      <text x="90" y="18" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle">KORELASI DENGAN DBD</text>
      <text x="90" y="34" fill="#818cf8" font-size="13" font-weight="800" text-anchor="middle">r = +0.22 (Signifikan p &lt; 0.05)</text>
    </g>
  </g>

  <!-- Left Column: Empirical Timeline & Diurnal Chart -->
  <g transform="translate(50, 98)">
    <rect x="0" y="0" width="580" height="525" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" filter="url(#cardShadow6)"/>

    <text x="24" y="34" fill="#ffffff" font-size="14" font-weight="700">Fluktuasi Tutupan Awan (TCC) vs Kasus DBD Bulanan</text>
    <text x="24" y="52" fill="#94a3b8" font-size="11">Rata-rata Tutupan Awan ERA5-Land (0–100%) vs Kasus DBD (Sumatera Barat &amp; DIY)</text>

    <!-- Legend -->
    <g transform="translate(24, 72)">
      <rect x="0" y="3" width="14" height="10" rx="2" fill="#818cf8"/>
      <text x="20" y="12" fill="#e2e8f0" font-size="11">Tutupan Awan (%)</text>

      <circle cx="180" cy="8" r="4.5" fill="#f43f5e"/>
      <line x1="170" y1="8" x2="190" y2="8" stroke="#f43f5e" stroke-width="2"/>
      <text x="200" y="12" fill="#fca5a5" font-size="11">Kasus DBD (Jiwa)</text>

      <circle cx="340" cy="8" r="3.5" fill="#fbbf24"/>
      <line x1="330" y1="8" x2="350" y2="8" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 2"/>
      <text x="360" y="12" fill="#fde68a" font-size="11">Indeks Radiasi UV</text>
    </g>

    <!-- Chart Area (Width: 490, Height: 210, Baseline Y: 210) -->
    <g transform="translate(45, 105)">
      <!-- Grid lines -->
      <line x1="0" y1="210" x2="490" y2="210" stroke="#334155" stroke-width="1"/>
      <line x1="0" y1="157" x2="490" y2="157" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="0" y1="105" x2="490" y2="105" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="0" y1="52" x2="490" y2="52" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="0" y1="0" x2="490" y2="0" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>

      <!-- Y-Axis Left (Cloud %: 0 to 100%) -->
      <text x="-10" y="214" fill="#64748b" font-size="9.5" text-anchor="end">0%</text>
      <text x="-10" y="161" fill="#64748b" font-size="9.5" text-anchor="end">25%</text>
      <text x="-10" y="109" fill="#64748b" font-size="9.5" text-anchor="end">50%</text>
      <text x="-10" y="56" fill="#64748b" font-size="9.5" text-anchor="end">75%</text>
      <text x="-10" y="4" fill="#818cf8" font-size="9.5" font-weight="700" text-anchor="end">100%</text>

      <!-- Y-Axis Right (Cases: 0 to 4.000) -->
      <text x="500" y="214" fill="#64748b" font-size="9.5">0</text>
      <text x="500" y="161" fill="#64748b" font-size="9.5">1.0k</text>
      <text x="500" y="109" fill="#64748b" font-size="9.5">2.0k</text>
      <text x="500" y="56" fill="#64748b" font-size="9.5">3.0k</text>
      <text x="500" y="4" fill="#f43f5e" font-size="9.5" font-weight="700">4.0k Jiwa</text>

      <!-- Bars: Cloud Cover % (10 Months: Okt s/d Jul, dx = 49px) -->
      <!-- Okt: 52% (h=109, y=101) -->
      <rect x="14" y="101" width="24" height="109" rx="3" fill="url(#cloudGrad)" opacity="0.6"/>
      <text x="26" y="228" fill="#64748b" font-size="10" text-anchor="middle">Okt</text>

      <!-- Nov: 68% (h=142, y=68) -->
      <rect x="63" y="68" width="24" height="142" rx="3" fill="url(#cloudGrad)" opacity="0.75"/>
      <text x="75" y="228" fill="#64748b" font-size="10" text-anchor="middle">Nov</text>

      <!-- Des: 82% (h=172, y=38) -->
      <rect x="112" y="38" width="24" height="172" rx="3" fill="url(#cloudGrad)" opacity="0.85"/>
      <text x="124" y="228" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">Des</text>

      <!-- Jan: 89% (Puncak Awan, h=187, y=23) -->
      <rect x="161" y="23" width="24" height="187" rx="3" fill="url(#cloudGrad)"/>
      <text x="173" y="228" fill="#818cf8" font-size="10.5" font-weight="800" text-anchor="middle">Jan</text>
      <text x="173" y="15" fill="#818cf8" font-size="9.5" font-weight="700" text-anchor="middle">89% Awan</text>

      <!-- Feb: 84% (h=176, y=34) -->
      <rect x="210" y="34" width="24" height="176" rx="3" fill="url(#cloudGrad)" opacity="0.85"/>
      <text x="222" y="228" fill="#64748b" font-size="10" text-anchor="middle">Feb</text>

      <!-- Mar: 74% (Puncak DBD, h=155, y=55) -->
      <rect x="259" y="55" width="24" height="155" rx="3" fill="url(#cloudGrad)" opacity="0.8"/>
      <text x="271" y="228" fill="#f43f5e" font-size="10.5" font-weight="800" text-anchor="middle">Mar</text>

      <!-- Apr: 62% (h=130, y=80) -->
      <rect x="308" y="80" width="24" height="130" rx="3" fill="url(#cloudGrad)" opacity="0.65"/>
      <text x="320" y="228" fill="#64748b" font-size="10" text-anchor="middle">Apr</text>

      <!-- Mei: 48% (h=100, y=110) -->
      <rect x="357" y="110" width="24" height="100" rx="3" fill="url(#cloudGrad)" opacity="0.55"/>
      <text x="369" y="228" fill="#64748b" font-size="10" text-anchor="middle">Mei</text>

      <!-- Jun: 38% (h=80, y=130) -->
      <rect x="406" y="130" width="24" height="80" rx="3" fill="url(#cloudGrad)" opacity="0.45"/>
      <text x="418" y="228" fill="#64748b" font-size="10" text-anchor="middle">Jun</text>

      <!-- Jul: 32% (h=67, y=143) -->
      <rect x="455" y="143" width="24" height="67" rx="3" fill="url(#cloudGrad)" opacity="0.4"/>
      <text x="467" y="228" fill="#64748b" font-size="10" text-anchor="middle">Jul</text>

      <!-- UV Radiation Curve (Inverted with cloud) -->
      <!-- Okt: UV 9 (y=30), Jan: UV 3 (y=160), Jul: UV 10 (y=15) -->
      <path d="M 26,45 Q 124,150 173,165 T 271,110 T 369,60 T 467,25" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3"/>

      <!-- Dengue Cases Curve (Red) -->
      <!-- Scale: 210px / 4000 = 0.0525 px/kasus. Okt: 800 (y=168), Nov: 1200 (y=147), Des: 2100 (y=100), Jan: 3200 (y=42), Feb: 3700 (y=16), Mar: 3850 (y=8), Apr: 2900 (y=58), Mei: 1700 (y=121), Jun: 1100 (y=152), Jul: 650 (y=176) -->
      <path d="M 26,168 L 75,147 L 124,100 L 173,42 L 222,16 L 271,8 L 320,58 L 369,121 L 418,152 L 467,176" fill="none" stroke="#f43f5e" stroke-width="3"/>

      <!-- Dots for Dengue Cases -->
      <circle cx="26" cy="168" r="3.5" fill="#f43f5e"/>
      <circle cx="75" cy="147" r="3.5" fill="#f43f5e"/>
      <circle cx="124" cy="100" r="4" fill="#f43f5e"/>
      <circle cx="173" cy="42" r="4.5" fill="#f43f5e"/>
      <circle cx="222" cy="16" r="4.5" fill="#f43f5e"/>
      <circle cx="271" cy="8" r="6" fill="#f43f5e" stroke="#ffffff" stroke-width="2"/>
      <circle cx="320" cy="58" r="4" fill="#f43f5e"/>
      <circle cx="369" cy="121" r="3.5" fill="#f43f5e"/>
      <circle cx="418" cy="152" r="3.5" fill="#f43f5e"/>
      <circle cx="467" cy="176" r="3.5" fill="#f43f5e"/>

      <!-- Peak Label -->
      <rect x="230" y="-18" width="85" height="18" rx="4" fill="#be123c"/>
      <text x="272" y="-5" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">3.850 Kasus</text>
    </g>

    <!-- Bottom Explanation Box -->
    <g transform="translate(24, 385)">
      <rect x="0" y="0" width="532" height="115" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="22" fill="#818cf8" font-size="11" font-weight="700">Fakta Kunci Pengaruh Tutupan Awan (Cloud Cover):</text>
      <text x="16" y="42" fill="#e2e8f0" font-size="11">• <tspan fill="#fbbf24" font-weight="700">Penghalang UV-B Alami:</tspan> Terik matahari langsung membunuh nyamuk akibat dehidrasi cepat.</text>
      <text x="16" y="62" fill="#e2e8f0" font-size="11">• Saat langit berawan (TCC &gt; 70%), radiasi UV turun drastis, nyamuk bebas terbang di pekarangan.</text>
      <text x="16" y="86" fill="#cbd5e1" font-size="10.5">Korelasi: r = +0.22 tergolong <tspan fill="#ffffff" font-weight="700">moderat-positif</tspan> karena sebagian besar efek awan sudah berkorelasi dengan curah hujan (kolinier).</text>
    </g>
  </g>

  <!-- Right Column: Biological Mechanisms & Data Decisions -->
  <g transform="translate(650, 98)">
    <rect x="0" y="0" width="580" height="525" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" filter="url(#cardShadow6)"/>

    <text x="24" y="34" fill="#ffffff" font-size="14" font-weight="700">Mekanisme Entomologi &amp; Keputusan Fitur AI</text>
    <text x="24" y="52" fill="#94a3b8" font-size="11">Mengapa tutupan awan dimasukkan sebagai fitur pendukung, bukan fitur utama</text>

    <!-- 3 Step Cards -->
    <g transform="translate(24, 70)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="532" height="85" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
        <circle cx="24" cy="24" r="12" fill="#1e293b"/>
        <text x="24" y="28" fill="#818cf8" font-size="11" font-weight="800" text-anchor="middle">1</text>
        <text x="46" y="24" fill="#ffffff" font-size="12" font-weight="700">Perpanjangan Jendela Menggigit (Diurnal Feeding Expansion)</text>
        <text x="46" y="44" fill="#94a3b8" font-size="11">Pada hari cerah terik, nyamuk Aedes hanya menggigit 2 jam di pagi &amp; sore hari.</text>
        <text x="46" y="60" fill="#e2e8f0" font-size="11">Pada hari mendung berawan, nyamuk aktif mencari mangsa sepanjang siang (08.00–16.00).</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 97)">
        <rect x="0" y="0" width="532" height="85" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
        <circle cx="24" cy="24" r="12" fill="#1e293b"/>
        <text x="24" y="28" fill="#818cf8" font-size="11" font-weight="800" text-anchor="middle">2</text>
        <text x="46" y="24" fill="#ffffff" font-size="12" font-weight="700">Stabilitas Suhu Air di Kontainer Terbuka (Breeding Site)</text>
        <text x="46" y="44" fill="#94a3b8" font-size="11">Awan mencegah air genangan (ban bekas, kaleng, drum) menjadi terlalu panas (&gt;35°C),</text>
        <text x="46" y="60" fill="#94a3b8" font-size="11">sehingga jentik nyamuk terhindar dari kematian termal dan berhasil menjadi pupa.</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 194)">
        <rect x="0" y="0" width="532" height="85" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
        <circle cx="24" cy="24" r="12" fill="#10b981" font-size="11" font-weight="800" text-anchor="middle">3</circle>
        <text x="46" y="24" fill="#ffffff" font-size="12" font-weight="700">Uji Multikolinearitas Model DengueCast (VIF Check)</text>
        <text x="46" y="44" fill="#94a3b8" font-size="11">Tutupan awan memiliki korelasi tinggi dengan curah hujan (r = +0.67 antar fitur).</text>
        <text x="46" y="60" fill="#cbd5e1" font-size="11">Untuk mencegah multikolinearitas (VIF &gt; 5), fitur ini di-regulerisasi via ElasticNet/Ridge.</text>
      </g>
    </g>

    <!-- Actionable Policy Box -->
    <g transform="translate(24, 385)">
      <rect x="0" y="0" width="532" height="115" rx="8" fill="#131d31" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" fill="#818cf8" font-size="11" font-weight="700">Implikasi Program Pencegahan di Sekolah &amp; Kantor:</text>
      <text x="16" y="44" fill="#e2e8f0" font-size="11">1. <tspan font-weight="700" fill="#ffffff">Hari Berawan = Risiko Tertinggi di Sekolah:</tspan> Siswa rentan digigit saat istirahat siang di lapangan/taman.</text>
      <text x="16" y="64" fill="#e2e8f0" font-size="11">2. <tspan font-weight="700" fill="#ffffff">Edukasi Lotion Anti-Nyamuk:</tspan> Puskesmas menyarankan pemakaian repellent saat cuaca mendung.</text>
      <text x="16" y="86" fill="#94a3b8" font-size="10.5">Status Fitur: <tspan fill="#34d399" font-weight="700">Dipertahankan sebagai Variabel Pendukung</tspan> untuk fine-tuning model musiman.</text>
    </g>
  </g>
</svg>
