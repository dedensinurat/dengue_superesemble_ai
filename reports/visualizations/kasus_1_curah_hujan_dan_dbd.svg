<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" style="background: #090d16; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Bar Gradient -->
    <linearGradient id="rainCleanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="cardShadow1" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Clean Background -->
  <rect width="1280" height="720" fill="#090d16"/>

  <!-- Subtle Header Divider -->
  <line x1="50" y1="82" x2="1230" y2="82" stroke="#1e293b" stroke-width="1"/>

  <!-- ================= TOP HEADER ================= -->
  <g transform="translate(50, 24)">
    <text x="0" y="14" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1">DENGUECAST • ANALISIS VARIABEL UTAMA (STUDI KASUS 1)</text>
    <text x="0" y="40" fill="#ffffff" font-size="22" font-weight="700">Dinamika Curah Hujan &amp; Fenomena Jeda Biologis (Lag 1–2 Bulan)</text>
    <text x="0" y="58" fill="#94a3b8" font-size="12">Bukti Empiris: Mengapa Puncak Pasien DBD Selalu Tertinggal 45–60 Hari Pasca Puncak Hujan di Jawa Barat</text>

    <!-- Clean Metric Pill Right -->
    <g transform="translate(1000, 2)">
      <rect x="0" y="0" width="180" height="42" rx="8" fill="#131d31" stroke="#334155" stroke-width="1"/>
      <text x="90" y="18" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle">KORELASI PUNCAK LAG 2</text>
      <text x="90" y="34" fill="#38bdf8" font-size="13" font-weight="800" text-anchor="middle">r = +0.52 (p &lt; 0.001)</text>
    </g>
  </g>

  <!-- ================= LEFT COLUMN: EMPIRICAL TIMELINE CHART ================= -->
  <g transform="translate(50, 98)">
    <rect x="0" y="0" width="580" height="525" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" filter="url(#cardShadow1)"/>

    <!-- Header -->
    <text x="24" y="34" fill="#ffffff" font-size="14" font-weight="700">Siklus Musiman: Curah Hujan vs Kasus DBD (Jawa Barat)</text>
    <text x="24" y="52" fill="#94a3b8" font-size="11">Data rata-rata bulanan multi-tahun Kemenkes RI &amp; ERA5-Land Reanalysis</text>

    <!-- Legend -->
    <g transform="translate(24, 72)">
      <rect x="0" y="3" width="14" height="10" rx="2" fill="#38bdf8"/>
      <text x="20" y="12" fill="#e2e8f0" font-size="11">Curah Hujan (mm)</text>

      <circle cx="210" cy="8" r="4.5" fill="#f43f5e"/>
      <line x1="200" y1="8" x2="220" y2="8" stroke="#f43f5e" stroke-width="2"/>
      <text x="230" y="12" fill="#fca5a5" font-size="11">Kasus DBD (Jiwa)</text>
    </g>

    <!-- CHART AREA (Width: 490, Height: 210, Baseline Y: 210) -->
    <g transform="translate(45, 105)">
      <!-- Grid lines -->
      <line x1="0" y1="210" x2="490" y2="210" stroke="#334155" stroke-width="1"/>
      <line x1="0" y1="157" x2="490" y2="157" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="0" y1="105" x2="490" y2="105" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="0" y1="52" x2="490" y2="52" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="0" y1="0" x2="490" y2="0" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>

      <!-- Y-Axis Left (Rainfall mm: 0 to 400) -->
      <text x="-10" y="214" fill="#64748b" font-size="9.5" text-anchor="end">0</text>
      <text x="-10" y="161" fill="#64748b" font-size="9.5" text-anchor="end">100</text>
      <text x="-10" y="109" fill="#64748b" font-size="9.5" text-anchor="end">200</text>
      <text x="-10" y="56" fill="#64748b" font-size="9.5" text-anchor="end">300</text>
      <text x="-10" y="4" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="end">400 mm</text>

      <!-- Y-Axis Right (Cases: 0 to 6.000) -->
      <text x="500" y="214" fill="#64748b" font-size="9.5">0</text>
      <text x="500" y="161" fill="#64748b" font-size="9.5">1.5k</text>
      <text x="500" y="109" fill="#64748b" font-size="9.5">3.0k</text>
      <text x="500" y="56" fill="#64748b" font-size="9.5">4.5k</text>
      <text x="500" y="4" fill="#f43f5e" font-size="9.5" font-weight="700">6.0k Jiwa</text>

      <!-- BARS: Rainfall (10 Months: Okt s/d Jul, dx = 49px) -->
      <!-- Okt: 180mm (h=94, y=116) -->
      <rect x="14" y="116" width="24" height="94" rx="3" fill="url(#rainCleanGrad)" opacity="0.65"/>
      <text x="26" y="228" fill="#64748b" font-size="10" text-anchor="middle">Okt</text>

      <!-- Nov: 290mm (h=152, y=58) -->
      <rect x="63" y="58" width="24" height="152" rx="3" fill="url(#rainCleanGrad)" opacity="0.75"/>
      <text x="75" y="228" fill="#64748b" font-size="10" text-anchor="middle">Nov</text>

      <!-- Des: 370mm (h=194, y=16) -->
      <rect x="112" y="16" width="24" height="194" rx="3" fill="url(#rainCleanGrad)" opacity="0.9"/>
      <text x="124" y="228" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">Des</text>

      <!-- Jan: 390mm (PUNCAK HUJAN, h=204, y=6) -->
      <rect x="161" y="6" width="24" height="204" rx="3" fill="url(#rainCleanGrad)"/>
      <text x="173" y="228" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle">Jan</text>
      <text x="173" y="-2" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="middle">390mm</text>

      <!-- Feb: 310mm (h=162, y=48) -->
      <rect x="210" y="48" width="24" height="162" rx="3" fill="url(#rainCleanGrad)" opacity="0.8"/>
      <text x="222" y="228" fill="#64748b" font-size="10" text-anchor="middle">Feb</text>

      <!-- Mar: 260mm (PUNCAK KASUS DBD, h=136, y=74) -->
      <rect x="259" y="74" width="24" height="136" rx="3" fill="url(#rainCleanGrad)" opacity="0.7"/>
      <text x="271" y="228" fill="#f43f5e" font-size="10.5" font-weight="800" text-anchor="middle">Mar</text>

      <!-- Apr: 200mm (h=105, y=105) -->
      <rect x="308" y="105" width="24" height="105" rx="3" fill="url(#rainCleanGrad)" opacity="0.55"/>
      <text x="320" y="228" fill="#64748b" font-size="10" text-anchor="middle">Apr</text>

      <!-- Mei: 130mm (h=68, y=142) -->
      <rect x="357" y="142" width="24" height="68" rx="3" fill="url(#rainCleanGrad)" opacity="0.45"/>
      <text x="369" y="228" fill="#64748b" font-size="10" text-anchor="middle">Mei</text>

      <!-- Jun: 80mm (h=42, y=168) -->
      <rect x="406" y="168" width="24" height="42" rx="3" fill="url(#rainCleanGrad)" opacity="0.35"/>
      <text x="418" y="228" fill="#64748b" font-size="10" text-anchor="middle">Jun</text>

      <!-- Jul: 40mm (h=21, y=189) -->
      <rect x="455" y="189" width="24" height="21" rx="3" fill="url(#rainCleanGrad)" opacity="0.25"/>
      <text x="467" y="228" fill="#64748b" font-size="10" text-anchor="middle">Jul</text>

      <!-- LINE CHART: Dengue Cases -->
      <path d="M 26 168 L 75 154 L 124 133 L 173 91 L 222 38 L 271 10 L 320 42 L 369 101 L 418 143 L 467 164"
            fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Dots -->
      <circle cx="26" cy="168" r="4" fill="#f43f5e"/>
      <circle cx="75" cy="154" r="4" fill="#f43f5e"/>
      <circle cx="124" cy="133" r="4" fill="#f43f5e"/>
      <circle cx="173" cy="91" r="4" fill="#f43f5e"/>
      <circle cx="222" cy="38" r="4.5" fill="#f43f5e"/>

      <!-- Peak Point Dot & Badge -->
      <circle cx="271" cy="10" r="6" fill="#f43f5e" stroke="#ffffff" stroke-width="2"/>
      <rect x="238" y="-18" width="66" height="18" rx="4" fill="#881337" stroke="#e11d48" stroke-width="1"/>
      <text x="271" y="-5" fill="#ffffff" font-size="9.5" font-weight="800" text-anchor="middle">5.700 Kasus</text>

      <circle cx="320" cy="42" r="4" fill="#f43f5e"/>
      <circle cx="369" cy="101" r="4" fill="#f43f5e"/>
      <circle cx="418" cy="143" r="4" fill="#f43f5e"/>
      <circle cx="467" cy="164" r="4" fill="#f43f5e"/>

      <!-- Clean Lag Arrow -->
      <path d="M 173 -10 L 230 -10" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="3 2"/>
      <polygon points="230,-10 224,-13 224,-7" fill="#fbbf24"/>
      <text x="201" y="-15" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">JEDA ~60 HARI</text>
    </g>

    <!-- CLEAN BOTTOM EXPLANATION BOX -->
    <g transform="translate(24, 385)">
      <rect x="0" y="0" width="532" height="115" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="22" fill="#38bdf8" font-size="11" font-weight="700">Fakta Kunci Kurva di Atas:</text>
      <text x="16" y="42" fill="#e2e8f0" font-size="11">• Curah hujan tertinggi terjadi di <tspan fill="#38bdf8" font-weight="700">Januari (390 mm)</tspan>, saat genangan mulai terbentuk.</text>
      <text x="16" y="62" fill="#e2e8f0" font-size="11">• Kasus DBD di rumah sakit memuncak di <tspan fill="#f43f5e" font-weight="700">Maret (5.700 kasus)</tspan>, tertinggal ~2 bulan.</text>
      <text x="16" y="86" fill="#cbd5e1" font-size="10.5">Kesimpulan: Model yang hanya memakai curah hujan bulan berjalan (lag-0) akan <tspan fill="#f87171" font-weight="700">terlambat mendeteksi wabah</tspan>!</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: CLEAN BIOLOGICAL TIMELINE ================= -->
  <g transform="translate(650, 98)">
    <rect x="0" y="0" width="580" height="525" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" filter="url(#cardShadow1)"/>

    <text x="24" y="34" fill="#ffffff" font-size="14" font-weight="700">Rantai Kausalitas Biologis &amp; Timeline Transmisi</text>
    <text x="24" y="52" fill="#94a3b8" font-size="11">Mengapa dibutuhkan waktu 45–60 hari dari air hujan hingga pasien tiba di RS</text>

    <!-- 4 CLEAN VERTICAL STEPS -->
    <g transform="translate(24, 70)">
      <!-- STEP 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="532" height="66" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
        <circle cx="22" cy="22" r="11" fill="#1e293b"/>
        <text x="22" y="26" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle">1</text>
        <text x="42" y="22" fill="#ffffff" font-size="12" font-weight="700">Bulan 0 (Hari 1–15): Hujan Mengisi Wadah Perindukan</text>
        <text x="42" y="42" fill="#94a3b8" font-size="11">Air hujan mengisi talang air, ban bekas, dan wadah sampah. Telur dorman mulai terendam.</text>
      </g>

      <!-- STEP 2 -->
      <g transform="translate(0, 76)">
        <rect x="0" y="0" width="532" height="66" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
        <circle cx="22" cy="22" r="11" fill="#1e293b"/>
        <text x="22" y="26" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle">2</text>
        <text x="42" y="22" fill="#ffffff" font-size="12" font-weight="700">Bulan 1 (Hari 16–35): Perkembangan Larva Menjadi Nyamuk Dewasa</text>
        <text x="42" y="42" fill="#94a3b8" font-size="11">Siklus telur → jentik → nyamuk dewasa butuh 7–10 hari. Populasi nyamuk melonjak tajam.</text>
      </g>

      <!-- STEP 3 -->
      <g transform="translate(0, 152)">
        <rect x="0" y="0" width="532" height="66" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
        <circle cx="22" cy="22" r="11" fill="#1e293b"/>
        <text x="22" y="26" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle">3</text>
        <text x="42" y="22" fill="#ffffff" font-size="12" font-weight="700">Bulan 1.5 (Hari 36–50): Masa Inkubasi Ganda (EIP &amp; Manusia)</text>
        <text x="42" y="42" fill="#94a3b8" font-size="11">Virus matang di tubuh nyamuk (EIP 8–12 hari) + inkubasi dalam darah manusia (4–7 hari).</text>
      </g>

      <!-- STEP 4 -->
      <g transform="translate(0, 228)">
        <rect x="0" y="0" width="532" height="66" rx="8" fill="#131d31" stroke="#334155" stroke-width="1"/>
        <circle cx="22" cy="22" r="11" fill="#1e293b"/>
        <text x="22" y="26" fill="#f43f5e" font-size="10.5" font-weight="800" text-anchor="middle">4</text>
        <text x="42" y="22" fill="#ffffff" font-size="12" font-weight="700">Bulan 2 (Hari 50–65): Pasien Berobat &amp; Puncak Rawat Inap RS</text>
        <text x="42" y="42" fill="#94a3b8" font-size="11">Demam hari ke-3 s/d 5 memicu trombositopenia. Pasien dirujuk ke RS &amp; klaim BPJS naik.</text>
      </g>
    </g>

    <!-- ACTIONABLE HEALTHCARE POLICY BOX -->
    <g transform="translate(24, 385)">
      <rect x="0" y="0" width="532" height="115" rx="8" fill="#131d31" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" fill="#38bdf8" font-size="11" font-weight="700">Implikasi Strategis Bagi Dinkes &amp; BPJS Kesehatan:</text>
      <text x="16" y="44" fill="#e2e8f0" font-size="11">1. <tspan font-weight="700" fill="#ffffff">Jendela Emas Intervensi:</tspan> PSN 3M Plus dan larvasidasi harus berjalan di <tspan fill="#38bdf8" font-weight="700">Bulan 0 (Desember)</tspan></text>
      <text x="32" y="60" fill="#94a3b8" font-size="10.5">saat hujan lebat mulai turun guna mematikan siklus jentik sebelum menjadi nyamuk.</text>
      <text x="16" y="80" fill="#e2e8f0" font-size="11">2. <tspan font-weight="700" fill="#ffffff">Keterlambatan Tindakan:</tspan> Jika fogging baru digencarkan saat RS penuh di Bulan 2,</text>
      <text x="32" y="96" fill="#94a3b8" font-size="10.5">intervensi tersebut sudah terlambat karena transmisi virus sudah meluas di masyarakat.</text>
    </g>
  </g>

  <!-- ================= BOTTOM STATUS FOOTER ================= -->
  <g transform="translate(50, 638)">
    <rect x="0" y="0" width="1180" height="52" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="22" fill="#38bdf8" font-size="11" font-weight="700">Implementasi Dalam Model DengueCast:</text>
    <text x="20" y="39" fill="#94a3b8" font-size="11">DengueCast menyematkan fitur <tspan fill="#e2e8f0" font-weight="600">distributed lag terms (lag 1, lag 2, lag 3)</tspan> untuk curah hujan, sehingga peringatan dini risiko dapat diberikan <tspan fill="#38bdf8" font-weight="700">30 s/d 60 hari lebih awal</tspan> sebelum lonjakan tempat tidur RS terlampaui.</text>
  </g>
</svg>
