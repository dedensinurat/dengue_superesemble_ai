<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" style="background: #090d16; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="cardShadow8" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Clean Background -->
  <rect width="1280" height="720" fill="#090d16"/>

  <!-- Subtle Header Divider -->
  <line x1="50" y1="82" x2="1230" y2="82" stroke="#1e293b" stroke-width="1"/>

  <!-- Top Header -->
  <g transform="translate(50, 24)">
    <text x="0" y="14" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">DENGUECAST • ANALISIS VARIABEL DIUJI (STUDI KASUS 8)</text>
    <text x="0" y="40" fill="#ffffff" font-size="22" font-weight="700">Evaluasi Jarak Pandang &amp; Arah Angin: Pemilahan Sinyal vs Noise</text>
    <text x="0" y="58" fill="#94a3b8" font-size="12">Bukti Empiris: Mengapa Dua Fitur Atmosferik Ini Dieliminasi dari Model Utama Melalui Uji Signifikansi &amp; Multikolinearitas</text>

    <!-- Clean Metric Pill Right -->
    <g transform="translate(1000, 2)">
      <rect x="0" y="0" width="180" height="42" rx="8" fill="#131d31" stroke="#334155" stroke-width="1"/>
      <text x="90" y="18" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle">KORELASI TIDAK SIGNIFIKAN</text>
      <text x="90" y="34" fill="#cbd5e1" font-size="13" font-weight="800" text-anchor="middle">r = -0.12 &amp; r = +0.09</text>
    </g>
  </g>

  <!-- Left Column: Two Sub-Charts (Visibility & Wind Direction) -->
  <g transform="translate(50, 98)">
    <rect x="0" y="0" width="580" height="525" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" filter="url(#cardShadow8)"/>

    <!-- Sub-Chart 1: Visibility vs Dengue Cases in Haze Episode -->
    <g transform="translate(24, 20)">
      <text x="0" y="14" fill="#ffffff" font-size="13" font-weight="700">1. Jarak Pandang (Visibility, km) vs Kasus DBD (Riau &amp; Kalteng)</text>
      <text x="0" y="30" fill="#94a3b8" font-size="10.5">Korelasi r = -0.12 (Sangat lemah, efek kabut asap karhutla musiman)</text>

      <!-- Mini Chart Area: 532 x 130 -->
      <g transform="translate(10, 42)">
        <rect x="0" y="0" width="512" height="120" rx="6" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
        <line x1="30" y1="95" x2="490" y2="95" stroke="#334155" stroke-width="1"/>
        <line x1="30" y1="55" x2="490" y2="55" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
        <line x1="30" y1="15" x2="490" y2="15" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>

        <!-- Y labels -->
        <text x="22" y="98" fill="#64748b" font-size="9" text-anchor="end">2km</text>
        <text x="22" y="58" fill="#64748b" font-size="9" text-anchor="end">6km</text>
        <text x="22" y="18" fill="#64748b" font-size="9" text-anchor="end">10km</text>

        <!-- Scatter Points (Visibility vs DBD) showing near-random spread with slight depression at extreme low visibility -->
        <circle cx="60" cy="85" r="4" fill="#94a3b8" opacity="0.6"/>
        <circle cx="85" cy="78" r="4" fill="#94a3b8" opacity="0.6"/>
        <circle cx="120" cy="50" r="4" fill="#94a3b8" opacity="0.6"/>
        <circle cx="160" cy="40" r="4" fill="#94a3b8" opacity="0.6"/>
        <circle cx="210" cy="35" r="4" fill="#94a3b8" opacity="0.6"/>
        <circle cx="260" cy="25" r="5" fill="#f43f5e"/>
        <circle cx="310" cy="45" r="4" fill="#94a3b8" opacity="0.6"/>
        <circle cx="360" cy="30" r="5" fill="#f43f5e"/>
        <circle cx="410" cy="20" r="4" fill="#94a3b8" opacity="0.6"/>
        <circle cx="460" cy="35" r="4" fill="#94a3b8" opacity="0.6"/>

        <!-- Flat Regression Line -->
        <line x1="50" y1="65" x2="470" y2="40" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 3"/>

        <!-- Label -->
        <rect x="290" y="65" width="190" height="22" rx="4" fill="#090d16" stroke="#334155" stroke-width="1"/>
        <text x="385" y="80" fill="#cbd5e1" font-size="9.5" text-anchor="middle">Regresi Datar: Tidak Ada Hubungan Kausal</text>
      </g>
    </g>

    <!-- Sub-Chart 2: Wind Direction vs Seasonal Dengue Cycle -->
    <g transform="translate(24, 235)">
      <text x="0" y="14" fill="#ffffff" font-size="13" font-weight="700">2. Arah Angin (Derajat 0°–360°) vs Fluktuasi Kasus DBD</text>
      <text x="0" y="30" fill="#94a3b8" font-size="10.5">Korelasi r = +0.09 (Nilai sudut melingkar tidak dapat diregresikan linier)</text>

      <!-- Mini Polar / Direction Comparison -->
      <g transform="translate(10, 42)">
        <rect x="0" y="0" width="512" height="120" rx="6" fill="#131d31" stroke="#1e293b" stroke-width="1"/>

        <!-- Left Mini Compass -->
        <g transform="translate(70, 60)">
          <circle cx="0" cy="0" r="42" fill="none" stroke="#334155" stroke-width="1.5"/>
          <line x1="-42" y1="0" x2="42" y2="0" stroke="#1e293b" stroke-width="1"/>
          <line x1="0" y1="-42" x2="0" y2="42" stroke="#1e293b" stroke-width="1"/>
          <text x="0" y="-46" fill="#64748b" font-size="8.5" text-anchor="middle">U (0°)</text>
          <text x="50" y="3" fill="#64748b" font-size="8.5">T (90°)</text>
          <text x="0" y="52" fill="#64748b" font-size="8.5" text-anchor="middle">S (180°)</text>
          <text x="-52" y="3" fill="#64748b" font-size="8.5" text-anchor="end">B (270°)</text>

          <!-- Monsoon Arrows -->
          <!-- Barat Laut / Monsun Basah (Merah DBD Tinggi) -->
          <line x1="-30" y1="-25" x2="0" y2="0" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
          <circle cx="-30" cy="-25" r="4" fill="#38bdf8"/>
        </g>

        <!-- Explanation Right Text inside Box -->
        <g transform="translate(150, 20)">
          <text x="0" y="14" fill="#38bdf8" font-size="11" font-weight="700">• Monsun Barat (270°–315°): Membawa Hujan &amp; Uap Air</text>
          <text x="0" y="32" fill="#94a3b8" font-size="10.5">Efek arah angin sepenuhnya sudah terwakili oleh <tspan fill="#ffffff" font-weight="700">Curah Hujan &amp; RH</tspan>.</text>
          <text x="0" y="52" fill="#fbbf24" font-size="11" font-weight="700">• Angka Derajat Arah Angin = Non-Linier &amp; Siklikal</text>
          <text x="0" y="70" fill="#94a3b8" font-size="10.5">359° dan 1° berdekatan secara fisik, tapi matematis dianggap terjauh.</text>
        </g>
      </g>
    </g>

    <!-- Bottom Summary Box -->
    <g transform="translate(24, 435)">
      <rect x="0" y="0" width="532" height="70" rx="8" fill="#131d31" stroke="#334155" stroke-width="1"/>
      <text x="16" y="24" fill="#e2e8f0" font-size="11" font-weight="700">Kesimpulan Uji Empiris:</text>
      <text x="16" y="46" fill="#cbd5e1" font-size="10.5">Kedua variabel gagal membuktikan relasi kausalitas independen terhadap gigitan nyamuk.</text>
    </g>
  </g>

  <!-- Right Column: Model Selection & VIF Analysis -->
  <g transform="translate(650, 98)">
    <rect x="0" y="0" width="580" height="525" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" filter="url(#cardShadow8)"/>

    <text x="24" y="34" fill="#ffffff" font-size="14" font-weight="700">Prinsip Seleksi Fitur &amp; Uji Multikolinearitas (VIF)</text>
    <text x="24" y="52" fill="#94a3b8" font-size="11">Alasan akademis mengapa variabel ini tidak dimasukkan ke model utama</text>

    <!-- 3 Step Cards -->
    <g transform="translate(24, 70)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="532" height="85" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
        <circle cx="24" cy="24" r="12" fill="#1e293b"/>
        <text x="24" y="28" fill="#f43f5e" font-size="11" font-weight="800" text-anchor="middle">1</text>
        <text x="46" y="24" fill="#ffffff" font-size="12" font-weight="700">Prinsip Parsimoni (Occam's Razor)</text>
        <text x="46" y="44" fill="#94a3b8" font-size="11">Memasukkan variabel dengan korelasi lemah (r &lt; 0.15) hanya akan menambah derajat</text>
        <text x="46" y="60" fill="#e2e8f0" font-size="11">kebebasan (degrees of freedom) yang berisiko memicu <tspan fill="#f87171" font-weight="700">overfitting</tspan> pada data uji.</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 97)">
        <rect x="0" y="0" width="532" height="85" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
        <circle cx="24" cy="24" r="12" fill="#1e293b"/>
        <text x="24" y="28" fill="#f43f5e" font-size="11" font-weight="800" text-anchor="middle">2</text>
        <text x="46" y="24" fill="#ffffff" font-size="12" font-weight="700">Uji Inflasi Varian: VIF &gt; 12 pada Arah Angin</text>
        <text x="46" y="44" fill="#94a3b8" font-size="11">Karena arah angin mencerminkan pola musiman yang sama dengan hujan dan suhu,</text>
        <text x="46" y="60" fill="#94a3b8" font-size="11">terjadi kolinearitas parah yang mengacaukan estimasi error standard koefisien regresi.</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 194)">
        <rect x="0" y="0" width="532" height="85" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
        <circle cx="24" cy="24" r="12" fill="#10b981" font-size="11" font-weight="800" text-anchor="middle">3</circle>
        <text x="46" y="24" fill="#ffffff" font-size="12" font-weight="700">Metode Eliminasi LASSO (L1 Regularization)</text>
        <text x="46" y="44" fill="#94a3b8" font-size="11">Dalam eksperimen tuning LASSO, koefisien penalti otomatis menyusutkan</text>
        <text x="46" y="60" fill="#cbd5e1" font-size="11">bobot jarak pandang dan arah angin mentah menjadi <tspan fill="#10b981" font-weight="700">persis nol (β = 0)</tspan>.</text>
      </g>
    </g>

    <!-- Actionable Academic Box -->
    <g transform="translate(24, 385)">
      <rect x="0" y="0" width="532" height="115" rx="8" fill="#131d31" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" fill="#38bdf8" font-size="11" font-weight="700">Jawaban Standar untuk Dosen Penguji / Auditor Model:</text>
      <text x="16" y="44" fill="#e2e8f0" font-size="11">"Kami telah mengeksplorasi seluruh parameter cuaca BMKG. Namun berdasarkan uji empiris,</text>
      <text x="16" y="64" fill="#e2e8f0" font-size="11">jarak pandang dan arah angin terbukti tidak signifikan (p &gt; 0.05). Mengeliminasinya justru</text>
      <text x="16" y="86" fill="#38bdf8" font-size="10.5">meningkatkan stabilitas generalisasi model ke 34 provinsi tanpa kehilangan akurasi."</text>
    </g>
  </g>
</svg>
