<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" style="background: #090d16; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Wind Gradient -->
    <linearGradient id="windGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <filter id="cardShadow7" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Clean Background -->
  <rect width="1280" height="720" fill="#090d16"/>

  <!-- Subtle Header Divider -->
  <line x1="50" y1="82" x2="1230" y2="82" stroke="#1e293b" stroke-width="1"/>

  <!-- Top Header -->
  <g transform="translate(50, 24)">
    <text x="0" y="14" fill="#2dd4bf" font-size="11" font-weight="700" letter-spacing="1">DENGUECAST • ANALISIS VARIABEL PENDUKUNG (STUDI KASUS 7)</text>
    <text x="0" y="40" fill="#ffffff" font-size="22" font-weight="700">Kecepatan Angin &amp; Hambatan Aerodinamika Terbang Vektor Aedes</text>
    <text x="0" y="58" fill="#94a3b8" font-size="12">Bukti Empiris: Mengapa Angin Kencang (&gt;12 km/jam) Menekan Kasus DBD dan Mengapa Angin Tenang Mempercepat Penularan</text>

    <!-- Clean Metric Pill Right -->
    <g transform="translate(1000, 2)">
      <rect x="0" y="0" width="180" height="42" rx="8" fill="#131d31" stroke="#334155" stroke-width="1"/>
      <text x="90" y="18" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle">KORELASI NEGATIF</text>
      <text x="90" y="34" fill="#2dd4bf" font-size="13" font-weight="800" text-anchor="middle">r = -0.19 (Efek Supresi)</text>
    </g>
  </g>

  <!-- Left Column: Empirical Inversion Chart -->
  <g transform="translate(50, 98)">
    <rect x="0" y="0" width="580" height="525" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" filter="url(#cardShadow7)"/>

    <text x="24" y="34" fill="#ffffff" font-size="14" font-weight="700">Kurva Inversi: Kecepatan Angin (m/s) vs Kasus DBD Bulanan</text>
    <text x="24" y="52" fill="#94a3b8" font-size="11">Data ERA5-Land kecepatan angin 10m vs Surveilans DBD (Studi Komparasi NTT &amp; DIY)</text>

    <!-- Legend -->
    <g transform="translate(24, 72)">
      <rect x="0" y="3" width="14" height="10" rx="2" fill="#2dd4bf"/>
      <text x="20" y="12" fill="#e2e8f0" font-size="11">Kecepatan Angin (m/s)</text>

      <circle cx="210" cy="8" r="4.5" fill="#f43f5e"/>
      <line x1="200" y1="8" x2="220" y2="8" stroke="#f43f5e" stroke-width="2"/>
      <text x="230" y="12" fill="#fca5a5" font-size="11">Kasus DBD (Jiwa)</text>
    </g>

    <!-- Chart Area (Width: 490, Height: 210, Baseline Y: 210) -->
    <g transform="translate(45, 105)">
      <!-- Grid lines -->
      <line x1="0" y1="210" x2="490" y2="210" stroke="#334155" stroke-width="1"/>
      <line x1="0" y1="157" x2="490" y2="157" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="0" y1="105" x2="490" y2="105" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="0" y1="52" x2="490" y2="52" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="0" y1="0" x2="490" y2="0" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>

      <!-- Y-Axis Left (Wind m/s: 0 to 5 m/s) -->
      <text x="-10" y="214" fill="#64748b" font-size="9.5" text-anchor="end">0.0</text>
      <text x="-10" y="161" fill="#64748b" font-size="9.5" text-anchor="end">1.25</text>
      <text x="-10" y="109" fill="#64748b" font-size="9.5" text-anchor="end">2.50</text>
      <text x="-10" y="56" fill="#64748b" font-size="9.5" text-anchor="end">3.75</text>
      <text x="-10" y="4" fill="#2dd4bf" font-size="9.5" font-weight="700" text-anchor="end">5.0 m/s</text>

      <!-- Y-Axis Right (Cases: 0 to 3.500) -->
      <text x="500" y="214" fill="#64748b" font-size="9.5">0</text>
      <text x="500" y="161" fill="#64748b" font-size="9.5">850</text>
      <text x="500" y="109" fill="#64748b" font-size="9.5">1.7k</text>
      <text x="500" y="56" fill="#64748b" font-size="9.5">2.6k</text>
      <text x="500" y="4" fill="#f43f5e" font-size="9.5" font-weight="700">3.5k Jiwa</text>

      <!-- BARS: Wind Speed (m/s) -->
      <!-- Scale: 210px / 5.0 = 42 px per m/s -->
      <!-- Jan: 1.6 m/s (h=67, y=143) [Angin tenang di musim hujan] -->
      <rect x="14" y="143" width="24" height="67" rx="3" fill="url(#windGrad)" opacity="0.6"/>
      <text x="26" y="228" fill="#64748b" font-size="10" text-anchor="middle">Jan</text>

      <!-- Feb: 1.5 m/s (h=63, y=147) [Angin tenang] -->
      <rect x="63" y="147" width="24" height="63" rx="3" fill="url(#windGrad)" opacity="0.6"/>
      <text x="75" y="228" fill="#64748b" font-size="10" text-anchor="middle">Feb</text>

      <!-- Mar: 1.7 m/s (h=71, y=139) -->
      <rect x="112" y="139" width="24" height="71" rx="3" fill="url(#windGrad)" opacity="0.65"/>
      <text x="124" y="228" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">Mar</text>

      <!-- Apr: 2.1 m/s (h=88, y=122) -->
      <rect x="161" y="122" width="24" height="88" rx="3" fill="url(#windGrad)" opacity="0.7"/>
      <text x="173" y="228" fill="#64748b" font-size="10" text-anchor="middle">Apr</text>

      <!-- Mei: 2.9 m/s (h=122, y=88) -->
      <rect x="210" y="88" width="24" height="122" rx="3" fill="url(#windGrad)" opacity="0.75"/>
      <text x="222" y="228" fill="#64748b" font-size="10" text-anchor="middle">Mei</text>

      <!-- Jun: 3.6 m/s (h=151, y=59) -->
      <rect x="259" y="59" width="24" height="151" rx="3" fill="url(#windGrad)" opacity="0.85"/>
      <text x="271" y="228" fill="#64748b" font-size="10" text-anchor="middle">Jun</text>

      <!-- Jul: 4.4 m/s (Puncak Angin Kencang Musim Timur, h=185, y=25) -->
      <rect x="308" y="25" width="24" height="185" rx="3" fill="url(#windGrad)"/>
      <text x="320" y="228" fill="#2dd4bf" font-size="10.5" font-weight="800" text-anchor="middle">Jul</text>
      <text x="320" y="17" fill="#2dd4bf" font-size="9" font-weight="700" text-anchor="middle">4.4 m/s</text>

      <!-- Agu: 4.6 m/s (h=193, y=17) -->
      <rect x="357" y="17" width="24" height="193" rx="3" fill="url(#windGrad)"/>
      <text x="369" y="228" fill="#2dd4bf" font-size="10.5" font-weight="800" text-anchor="middle">Agu</text>

      <!-- Sep: 3.8 m/s (h=160, y=50) -->
      <rect x="406" y="50" width="24" height="160" rx="3" fill="url(#windGrad)" opacity="0.85"/>
      <text x="418" y="228" fill="#64748b" font-size="10" text-anchor="middle">Sep</text>

      <!-- Okt: 2.2 m/s (h=92, y=118) -->
      <rect x="455" y="118" width="24" height="92" rx="3" fill="url(#windGrad)" opacity="0.7"/>
      <text x="467" y="228" fill="#64748b" font-size="10" text-anchor="middle">Okt</text>

      <!-- Dengue Cases Curve (Opposite pattern - High in Jan-Apr, Low in Jul-Sep) -->
      <!-- Scale: 210px / 3500 = 0.06 px/kasus -->
      <!-- Jan: 2900 (y=36), Feb: 3350 (y=9), Mar: 3200 (y=18), Apr: 2400 (y=66), Mei: 1500 (y=120), Jun: 850 (y=159), Jul: 420 (y=185), Agu: 380 (y=187), Sep: 620 (y=173), Okt: 1250 (y=135) -->
      <path d="M 26,36 L 75,9 L 124,18 L 173,66 L 222,120 L 271,159 L 320,185 L 369,187 L 418,173 L 467,135" fill="none" stroke="#f43f5e" stroke-width="3"/>

      <!-- Dots for Dengue Cases -->
      <circle cx="26" cy="36" r="4.5" fill="#f43f5e"/>
      <circle cx="75" cy="9" r="6" fill="#f43f5e" stroke="#ffffff" stroke-width="2"/>
      <circle cx="124" cy="18" r="4.5" fill="#f43f5e"/>
      <circle cx="173" cy="66" r="4" fill="#f43f5e"/>
      <circle cx="222" cy="120" r="3.5" fill="#f43f5e"/>
      <circle cx="271" cy="159" r="3.5" fill="#f43f5e"/>
      <circle cx="320" cy="185" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="369" cy="187" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="418" cy="173" r="3.5" fill="#f43f5e"/>
      <circle cx="467" cy="135" r="3.5" fill="#f43f5e"/>

      <!-- Inversion Annotations -->
      <rect x="35" y="-18" width="95" height="18" rx="4" fill="#be123c"/>
      <text x="82" y="-5" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">3.350 (Angin Tenang)</text>

      <rect x="290" y="196" width="105" height="18" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="342" y="209" fill="#a7f3d0" font-size="8.5" font-weight="700" text-anchor="middle">380 (Angin Kencang)</text>
    </g>

    <!-- Bottom Explanation Box -->
    <g transform="translate(24, 385)">
      <rect x="0" y="0" width="532" height="115" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="22" fill="#2dd4bf" font-size="11" font-weight="700">Fakta Kunci Efek Supresi Kecepatan Angin:</text>
      <text x="16" y="42" fill="#e2e8f0" font-size="11">• <tspan fill="#2dd4bf" font-weight="700">Korelasi Terbalik (r = -0.19):</tspan> Setiap kenaikan kecepatan angin 1 m/s menekan probabilitas penularan.</text>
      <text x="16" y="62" fill="#e2e8f0" font-size="11">• Pada puncak angin musim timur (Juli–Agustus), kasus DBD nasional anjlok ke titik terendah (&lt;400 jiwa/provinsi).</text>
      <text x="16" y="86" fill="#cbd5e1" font-size="10.5">Mekanisme: Turbulensi udara mengacaukan jejak aroma inang dan menghalangi penerbangan nyamuk.</text>
    </g>
  </g>

  <!-- Right Column: Aerodynamics & Field Applications -->
  <g transform="translate(650, 98)">
    <rect x="0" y="0" width="580" height="525" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" filter="url(#cardShadow7)"/>

    <text x="24" y="34" fill="#ffffff" font-size="14" font-weight="700">Aerodinamika Nyamuk &amp; Protokol Operasional</text>
    <text x="24" y="52" fill="#94a3b8" font-size="11">Mengapa nyamuk Aedes aegypti tidak toleran terhadap hembusan angin kencang</text>

    <!-- 3 Step Cards -->
    <g transform="translate(24, 70)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="532" height="85" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
        <circle cx="24" cy="24" r="12" fill="#1e293b"/>
        <text x="24" y="28" fill="#2dd4bf" font-size="11" font-weight="800" text-anchor="middle">1</text>
        <text x="46" y="24" fill="#ffffff" font-size="12" font-weight="700">Batas Fisik Terbang Vektor (Berat 2.5 miligram)</text>
        <text x="46" y="44" fill="#94a3b8" font-size="11">Kecepatan jelajah mandiri Aedes hanya 1.0–1.5 m/s (3.6–5.4 km/jam).</text>
        <text x="46" y="60" fill="#e2e8f0" font-size="11">Bila angin &gt; 3.0 m/s (~11 km/jam), gaya hambat aerodinamika menghempaskan nyamuk ke tanah.</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 97)">
        <rect x="0" y="0" width="532" height="85" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
        <circle cx="24" cy="24" r="12" fill="#1e293b"/>
        <text x="24" y="28" fill="#2dd4bf" font-size="11" font-weight="800" text-anchor="middle">2</text>
        <text x="46" y="24" fill="#ffffff" font-size="12" font-weight="700">Dispersi Jejak Karbondioksida (Host Plume Breakdown)</text>
        <text x="46" y="44" fill="#94a3b8" font-size="11">Nyamuk melacak manusia melalui deteksi aliran lurus CO2 pernapasan.</text>
        <text x="46" y="60" fill="#94a3b8" font-size="11">Angin kencang memecah gas CO2 menjadi pusaran turbulen, sehingga nyamuk disorientasi arah.</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 194)">
        <rect x="0" y="0" width="532" height="85" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
        <circle cx="24" cy="24" r="12" fill="#10b981" font-size="11" font-weight="800" text-anchor="middle">3</circle>
        <text x="46" y="24" fill="#ffffff" font-size="12" font-weight="700">Koefisien Negatif dalam GLM DengueCast</text>
        <text x="46" y="44" fill="#94a3b8" font-size="11">Model regresi Negative Binomial memberikan koefisien negatif (β_wind &lt; 0),</text>
        <text x="46" y="60" fill="#cbd5e1" font-size="11">secara akurat meredam proyeksi wabah di bulan-bulan berangin kencang (musim kemarau/timur).</text>
      </g>
    </g>

    <!-- Actionable Policy Box -->
    <g transform="translate(24, 385)">
      <rect x="0" y="0" width="532" height="115" rx="8" fill="#131d31" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" fill="#2dd4bf" font-size="11" font-weight="700">Standard Operating Procedure (SOP) Fogging Dinas Kesehatan:</text>
      <text x="16" y="44" fill="#e2e8f0" font-size="11">1. <tspan font-weight="700" fill="#ffffff">Larangan Fogging saat Angin Kencang:</tspan> Droplet insektisida akan terbawa kabur dan tidak membunuh nyamuk.</text>
      <text x="16" y="64" fill="#e2e8f0" font-size="11">2. <tspan font-weight="700" fill="#ffffff">Jam Emas Fogging (06.00–08.00):</tspan> Saat inversi suhu permukaan dan angin mendekati tenang (&lt;1.5 m/s).</text>
      <text x="16" y="86" fill="#94a3b8" font-size="10.5">Status Fitur: <tspan fill="#2dd4bf" font-weight="700">Dipertahankan sebagai Koreksi Supresi</tspan> untuk mencegah over-prediction.</text>
    </g>
  </g>
</svg>
