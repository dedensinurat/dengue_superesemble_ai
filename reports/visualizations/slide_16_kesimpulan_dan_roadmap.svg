<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" style="background: #090d16; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad16" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#09111e"/>
    </linearGradient>

    <!-- Header & Accent Gradients -->
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardBg16" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="cardShadow16" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad16)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="90" x2="1280" y2="90"/>
    <line x1="0" y1="670" x2="1280" y2="670"/>
    <line x1="430" y1="90" x2="430" y2="670"/>
    <line x1="850" y1="90" x2="850" y2="670"/>
  </g>

  <!-- ================= TOP HEADER ================= -->
  <g transform="translate(50, 24)">
    <!-- Badge -->
    <rect x="0" y="0" width="280" height="24" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#10b981"/>
    <text x="24" y="16" fill="#6ee7b7" font-size="11" font-weight="700" letter-spacing="1">DENGUECAST • SINTESIS &amp; ROADMAP</text>

    <!-- Main Title -->
    <text x="0" y="48" fill="#f8fafc" font-size="22" font-weight="800">16. Kesimpulan, Batasan Data, dan Langkah Berikutnya</text>
    <text x="0" y="66" fill="#94a3b8" font-size="12">Refleksi Kritis atas Prototipe Sistem Peramalan Probabilistik DBD dan Peta Jalan Operasionalisasi Menuju Kebijakan Kesehatan</text>
  </g>

  <!-- Number 16 Indicator Badge (Right Top) -->
  <g transform="translate(1170, 26)">
    <rect x="0" y="0" width="60" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="30" y="27" fill="#10b981" font-size="18" font-weight="800" text-anchor="middle">16</text>
    <text x="30" y="38" fill="#64748b" font-size="8" font-weight="600" text-anchor="middle">SLIDE</text>
  </g>

  <!-- ================= COLUMN 1: KESIMPULAN UTAMA ================= -->
  <g transform="translate(45, 105)">
    <rect x="0" y="0" width="375" height="550" rx="12" fill="url(#cardBg16)" stroke="#065f46" stroke-width="1.5" filter="url(#cardShadow16)"/>
    
    <!-- Column Header -->
    <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 363 0 C 369.627 0 375 5.373 375 12 L 375 42 L 0 42 Z" fill="#065f46" fill-opacity="0.4"/>
    <rect x="16" y="13" width="6" height="16" rx="3" fill="#10b981"/>
    <text x="30" y="26" fill="#f8fafc" font-size="14" font-weight="700">A. KESIMPULAN UTAMA</text>
    <text x="355" y="26" fill="#34d399" font-size="11" font-weight="600" text-anchor="end">Key Insights</text>

    <!-- Card 1.1: Validitas D-MOSS di Indonesia -->
    <g transform="translate(14, 52)">
      <rect x="0" y="0" width="347" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <rect x="10" y="8" width="220" height="18" rx="4" fill="#064e3b"/>
      <text x="16" y="21" fill="#a7f3d0" font-size="10" font-weight="700">1. PERINGATAN DINI 1–6 BULAN</text>

      <text x="14" y="42" fill="#e2e8f0" font-size="11">• <tspan font-weight="600">Transformasi Respon Reaktif ke Preventif</tspan>:</text>
      <text x="24" y="56" fill="#94a3b8" font-size="10.5">Membuktikan arsitektur D-MOSS dapat diadaptasi</text>
      <text x="24" y="69" fill="#94a3b8" font-size="10.5">untuk dinamika 34 provinsi di Indonesia.</text>

      <text x="14" y="87" fill="#e2e8f0" font-size="11">• <tspan font-weight="600">Interval Ketidakpastian Eksplisit</tspan>:</text>
      <text x="24" y="101" fill="#34d399" font-size="10.5">Distribusi probabilistik jauh lebih kaya dari angka tunggal.</text>
    </g>

    <!-- Card 1.2: Heterogenitas Iklim Regional -->
    <g transform="translate(14, 172)">
      <rect x="0" y="0" width="347" height="142" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <rect x="10" y="8" width="225" height="18" rx="4" fill="#064e3b"/>
      <text x="16" y="21" fill="#a7f3d0" font-size="10" font-weight="700">2. HETEROGENITAS REGIONAL</text>

      <text x="14" y="42" fill="#e2e8f0" font-size="11">• <tspan font-weight="600">Model Nasional Seragam Terbukti Tidak Cocok</tspan>:</text>
      <text x="24" y="56" fill="#94a3b8" font-size="10.5">Hubungan iklim dan DBD sangat bervariasi antar-pulau.</text>

      <text x="14" y="74" fill="#e2e8f0" font-size="11">• <tspan font-weight="600">Curah Hujan &gt; Suhu Udara</tspan>:</text>
      <text x="24" y="88" fill="#94a3b8" font-size="10.5">18 provinsi koheren dengan hujan; hanya 7 dengan suhu.</text>

      <text x="14" y="106" fill="#e2e8f0" font-size="11">• <tspan font-weight="600">Dua Poros Sirkulasi Global</tspan>:</text>
      <text x="24" y="120" fill="#94a3b8" font-size="10.5">ENSO (ONI) memicu puncak di Barat; IOD (DMI) kuat di Timur.</text>
      <text x="24" y="133" fill="#64748b" font-size="9.5">Sesuai studi Djaafara dkk. (2026), PLOS NTD.</text>
    </g>

    <!-- Card 1.3: Kinerja Superensemble -->
    <g transform="translate(14, 324)">
      <rect x="0" y="0" width="347" height="206" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1.2"/>
      <rect x="10" y="8" width="200" height="18" rx="4" fill="#064e3b"/>
      <text x="16" y="21" fill="#a7f3d0" font-size="10" font-weight="700">3. SUPERENSEMBLE UNGGUL</text>

      <text x="14" y="42" fill="#e2e8f0" font-size="11">• <tspan font-weight="600">Mengalahkan Baseline Musiman</tspan>:</text>
      <text x="24" y="56" fill="#94a3b8" font-size="10.5">Kombinasi berbobot 1/CRPS² memberikan skill score positif</text>
      <text x="24" y="69" fill="#94a3b8" font-size="10.5">(CRPSS &gt; 0) pada lead 1–3 di provinsi yang layak.</text>

      <!-- Metric Highlights Box -->
      <g transform="translate(12, 80)">
        <rect x="0" y="0" width="155" height="52" rx="6" fill="#1e293b"/>
        <text x="10" y="18" fill="#94a3b8" font-size="9.5">Cakupan 95% Kredibel</text>
        <text x="10" y="38" fill="#34d399" font-size="16" font-weight="800">88% – 97%</text>
        <text x="10" y="48" fill="#64748b" font-size="8.5">Terkalibrasi sangat baik</text>

        <rect x="165" y="0" width="158" height="52" rx="6" fill="#1e293b"/>
        <text x="175" y="18" fill="#94a3b8" font-size="9.5">Lead 1–6 Bulan</text>
        <text x="175" y="38" fill="#38bdf8" font-size="16" font-weight="800">Multi-Step</text>
        <text x="175" y="48" fill="#64748b" font-size="8.5">Rekursi autoregresif M0</text>
      </g>

      <rect x="12" y="142" width="323" height="52" rx="6" fill="#1e293b"/>
      <text x="20" y="160" fill="#fef08a" font-size="10" font-weight="700">Kesimpulan Strategis:</text>
      <text x="20" y="174" fill="#cbd5e1" font-size="10">Model probabilistik memberi justifikasi kuantitatif</text>
      <text x="20" y="187" fill="#cbd5e1" font-size="10">untuk intervensi sebelum lonjakan kasus terjadi.</text>
    </g>
  </g>

  <!-- ================= COLUMN 2: BATASAN DATA ================= -->
  <g transform="translate(452, 105)">
    <rect x="0" y="0" width="375" height="550" rx="12" fill="url(#cardBg16)" stroke="#991b1b" stroke-width="1.5" filter="url(#cardShadow16)"/>
    
    <!-- Column Header -->
    <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 363 0 C 369.627 0 375 5.373 375 12 L 375 42 L 0 42 Z" fill="#991b1b" fill-opacity="0.4"/>
    <rect x="16" y="13" width="6" height="16" rx="3" fill="#f43f5e"/>
    <text x="30" y="26" fill="#f8fafc" font-size="14" font-weight="700">B. BATASAN DATA &amp; METODOLOGI</text>
    <text x="355" y="26" fill="#fb7185" font-size="11" font-weight="600" text-anchor="end">System Limitations</text>

    <!-- Card 2.1: Diagnosis Klinis vs Lab -->
    <g transform="translate(14, 52)">
      <rect x="0" y="0" width="347" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <rect x="10" y="8" width="220" height="18" rx="4" fill="#4c0519"/>
      <text x="16" y="21" fill="#fecdd3" font-size="10" font-weight="700">1. KASUS KLINIS &amp; DISPARITAS</text>

      <text x="14" y="42" fill="#e2e8f0" font-size="11">• <tspan font-weight="600">Surveilans Pasif Rutin</tspan>:</text>
      <text x="24" y="56" fill="#94a3b8" font-size="10.5">Data kasus adalah diagnosis klinis, bukan konfirmasi</text>
      <text x="24" y="69" fill="#94a3b8" font-size="10.5">laboratorium virologi (PCR / NS1) secara menyeluruh.</text>

      <text x="14" y="87" fill="#e2e8f0" font-size="11">• <tspan font-weight="600">Potensi Under-Reporting</tspan>:</text>
      <text x="24" y="101" fill="#fb7185" font-size="10.5">Kapasitas pelaporan faskes di Indonesia Timur lebih rendah.</text>
    </g>

    <!-- Card 2.2: Faktor Biologis yang Tidak Dimodelkan -->
    <g transform="translate(14, 172)">
      <rect x="0" y="0" width="347" height="142" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <rect x="10" y="8" width="235" height="18" rx="4" fill="#4c0519"/>
      <text x="16" y="21" fill="#fecdd3" font-size="10" font-weight="700">2. FAKTOR TIDAK DIMODELKAN</text>

      <text x="14" y="42" fill="#f87171" font-size="11">• <tspan font-weight="600">Pergantian Serotipe Virus (DENV 1–4)</tspan>:</text>
      <text x="24" y="55" fill="#94a3b8" font-size="10">Lonjakan akibat pergeseran serotipe dominan belum tercakup.</text>

      <text x="14" y="72" fill="#f87171" font-size="11">• <tspan font-weight="600">Imunitas Silang Heterolog Populasi</tspan>:</text>
      <text x="24" y="85" fill="#94a3b8" font-size="10">Kekebalan sementara 6–12 bulan tidak dimodelkan mekanistik.</text>

      <text x="14" y="102" fill="#f87171" font-size="11">• <tspan font-weight="600">Intervensi Vektor &amp; Mobilitas Manusia</tspan>:</text>
      <text x="24" y="115" fill="#94a3b8" font-size="10">Pelepasan Wolbachia, PSN masif lokal, dan arus mudik komuter</text>
      <text x="24" y="127" fill="#94a3b8" font-size="10">belum tersedia dalam data agregat bulanan.</text>
    </g>

    <!-- Card 2.3: 16 Provinsi Kurang Andal & COVID -->
    <g transform="translate(14, 324)">
      <rect x="0" y="0" width="347" height="206" rx="8" fill="#0f172a" stroke="#b91c1c" stroke-width="1.2"/>
      <rect x="10" y="8" width="220" height="18" rx="4" fill="#450a0a"/>
      <text x="16" y="21" fill="#fecdd3" font-size="10" font-weight="700">3. PROVINSI KURANG ANDAL</text>

      <rect x="12" y="32" width="323" height="40" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="0.8"/>
      <text x="20" y="48" fill="#fecdd3" font-size="10.5" font-weight="700">16 dari 34 Provinsi Memiliki Koherensi Rendah (&lt;0.70)</text>
      <text x="20" y="62" fill="#cbd5e1" font-size="10">Sistem otomatis menandai: <tspan fill="#f43f5e" font-weight="700">reliable = False</tspan></text>

      <text x="14" y="88" fill="#e2e8f0" font-size="11">• <tspan font-weight="600">Rekomendasi Operasional Khusus</tspan>:</text>
      <text x="24" y="102" fill="#94a3b8" font-size="10.5">Untuk wilayah kurang andal, pemangku kebijakan</text>
      <text x="24" y="115" fill="#fecdd3" font-size="10.5" font-weight="600">wajib bertumpu pada saluran endemik historis,</text>
      <text x="24" y="128" fill="#94a3b8" font-size="10">bukan pada sinyal prakiraan iklim.</text>

      <!-- COVID Box -->
      <rect x="12" y="138" width="323" height="56" rx="6" fill="#1e293b"/>
      <text x="20" y="154" fill="#fbbf24" font-size="10" font-weight="700">• Distorsi Pandemi COVID-19 (2020–2021):</text>
      <text x="20" y="168" fill="#cbd5e1" font-size="9.5">Penurunan kunjungan faskes mendistorsi pelaporan kasus.</text>
      <text x="20" y="181" fill="#94a3b8" font-size="9">Opsi exclude_periods disiapkan untuk uji sensitivitas.</text>
    </g>
  </g>

  <!-- ================= COLUMN 3: LANGKAH BERIKUTNYA ================= -->
  <g transform="translate(860, 105)">
    <rect x="0" y="0" width="375" height="550" rx="12" fill="url(#cardBg16)" stroke="#1d4ed8" stroke-width="1.5" filter="url(#cardShadow16)"/>
    
    <!-- Column Header -->
    <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 363 0 C 369.627 0 375 5.373 375 12 L 375 42 L 0 42 Z" fill="#1d4ed8" fill-opacity="0.4"/>
    <rect x="16" y="13" width="6" height="16" rx="3" fill="#38bdf8"/>
    <text x="30" y="26" fill="#f8fafc" font-size="14" font-weight="700">C. LANGKAH BERIKUTNYA</text>
    <text x="355" y="26" fill="#7dd3fc" font-size="11" font-weight="600" text-anchor="end">Strategic Roadmap</text>

    <!-- Phase 1: Tahap B PyMC Hierarkis -->
    <g transform="translate(14, 52)">
      <rect x="0" y="0" width="347" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <rect x="10" y="8" width="160" height="18" rx="4" fill="#1e3a8a"/>
      <text x="16" y="21" fill="#93c5fd" font-size="10" font-weight="700">FASE 1: TAHAP B (BAYESIAN)</text>

      <text x="14" y="42" fill="#e2e8f0" font-size="11">• <tspan font-weight="600">Hierarchical Spatio-Temporal Model</tspan>:</text>
      <text x="24" y="56" fill="#94a3b8" font-size="10.5">Implementasi ICAR / BYM2 melalui PyMC untuk</text>
      <text x="24" y="69" fill="#94a3b8" font-size="10.5">meminjam kekuatan data antarprovinsi tetangga.</text>

      <text x="14" y="87" fill="#e2e8f0" font-size="11">• <tspan font-weight="600">Korelasi Autoregresif Spasial</tspan>:</text>
      <text x="24" y="101" fill="#38bdf8" font-size="10.5">Mereduksi ketidakpastian di wilayah dengan data terbatas.</text>
    </g>

    <!-- Phase 2: Prakiraan Iklim Musiman Global -->
    <g transform="translate(14, 172)">
      <rect x="0" y="0" width="347" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <rect x="10" y="8" width="220" height="18" rx="4" fill="#1e3a8a"/>
      <text x="16" y="21" fill="#93c5fd" font-size="10" font-weight="700">FASE 2: IKLIM MUSIMAN GLOBAL</text>

      <text x="14" y="42" fill="#e2e8f0" font-size="11">• <tspan font-weight="600">Integrasi ECMWF SEAS5 / Copernicus C3S</tspan>:</text>
      <text x="24" y="56" fill="#94a3b8" font-size="10.5">Menggantikan asumsi klimatologi statis dengan prakiraan</text>
      <text x="24" y="69" fill="#94a3b8" font-size="10.5">iklim ensemble multi-member dinamis operasional.</text>

      <text x="14" y="87" fill="#e2e8f0" font-size="11">• <tspan font-weight="600">Kalibrasi Hindcast Iklim</tspan>:</text>
      <text x="24" y="101" fill="#38bdf8" font-size="10.5">Koreksi bias suhu dan hujan prakiraan BMKG/ECMWF.</text>
    </g>

    <!-- Phase 3 & 4: Downscaling & BPJS -->
    <g transform="translate(14, 292)">
      <rect x="0" y="0" width="347" height="238" rx="8" fill="#0f172a" stroke="#2563eb" stroke-width="1.2"/>
      <rect x="10" y="8" width="235" height="18" rx="4" fill="#1e3a8a"/>
      <text x="16" y="21" fill="#93c5fd" font-size="10" font-weight="700">FASE 3 &amp; 4: DOWNSCALING &amp; BPJS</text>

      <text x="14" y="42" fill="#e2e8f0" font-size="11">• <tspan font-weight="600">Downscaling ke 514 Kabupaten/Kota</tspan>:</text>
      <text x="24" y="56" fill="#94a3b8" font-size="10.5">Peningkatan resolusi spasial bersama Dinas Kesehatan</text>
      <text x="24" y="69" fill="#94a3b8" font-size="10.5">untuk aksi langsung di tingkat Puskesmas &amp; Kecamatan.</text>

      <text x="14" y="88" fill="#e2e8f0" font-size="11">• <tspan font-weight="600">Inkorporasi Data Intervensi Wolbachia &amp; ABJ</tspan>:</text>
      <text x="24" y="102" fill="#94a3b8" font-size="10.5">Memasukkan cakupan rilis Wolbachia dan Angka Bebas Jentik.</text>

      <!-- BPJS Impact Banner -->
      <g transform="translate(12, 114)">
        <rect x="0" y="0" width="323" height="112" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8"/>
        <text x="12" y="18" fill="#38bdf8" font-size="11" font-weight="700">★ Integrasi Kebijakan &amp; Pembiayaan BPJS:</text>
        <circle cx="20" cy="36" r="3" fill="#38bdf8"/>
        <text x="30" y="40" fill="#f1f5f9" font-size="10"><tspan font-weight="600">Prediksi Beban Faskes</tspan>: Kesiapan ranap RS &amp; logistik obat</text>

        <circle cx="20" cy="56" r="3" fill="#38bdf8"/>
        <text x="30" y="60" fill="#f1f5f9" font-size="10"><tspan font-weight="600">Manajemen Finansial</tspan>: Antisipasi lonjakan klaim DBD BPJS</text>

        <circle cx="20" cy="76" r="3" fill="#38bdf8"/>
        <text x="30" y="80" fill="#f1f5f9" font-size="10"><tspan font-weight="600">Intervensi Preventif</tspan>: Alokasi anggaran promotif pra-musim</text>

        <rect x="12" y="90" width="299" height="16" rx="3" fill="#0f172a"/>
        <text x="161" y="102" fill="#34d399" font-size="9.5" font-weight="600" text-anchor="middle">Mewujudkan Sistem Ketahanan Kesehatan Nasional</text>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM FOOTER BAR ================= -->
  <g transform="translate(45, 675)">
    <rect x="0" y="0" width="1190" height="30" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="19" fill="#64748b" font-size="10.5">Rujukan Metodologi: Djaafara dkk. (2026) PLOS NTD; Colón-González dkk. (2021) Lancet Planet Health; Campbell dkk. (2026)</text>
    <text x="1170" y="19" fill="#94a3b8" font-size="10.5" text-anchor="end">DengueCast: Probabilistic Dengue Early Warning Framework • Indonesia</text>
  </g>
</svg>
