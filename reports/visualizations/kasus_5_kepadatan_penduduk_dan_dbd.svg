<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" style="background: #090d16; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Density Gradient -->
    <linearGradient id="densityGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <filter id="cardShadow5" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Clean Background -->
  <rect width="1280" height="720" fill="#090d16"/>

  <!-- Subtle Header Divider -->
  <line x1="50" y1="82" x2="1230" y2="82" stroke="#1e293b" stroke-width="1"/>

  <!-- Top Header -->
  <g transform="translate(50, 24)">
    <text x="0" y="14" fill="#10b981" font-size="11" font-weight="700" letter-spacing="1">DENGUECAST • ANALISIS VARIABEL PENDUKUNG (STUDI KASUS 5)</text>
    <text x="0" y="40" fill="#ffffff" font-size="22" font-weight="700">Kepadatan Penduduk &amp; Intensitas Kontak Vektor-Inang</text>
    <text x="0" y="58" fill="#94a3b8" font-size="12">Bukti Empiris: Mengapa Wilayah Urban Padat (Jawa-Bali) Menyumbang 57% Beban Kasus DBD Nasional</text>

    <!-- Clean Metric Pill Right -->
    <g transform="translate(1000, 2)">
      <rect x="0" y="0" width="180" height="42" rx="8" fill="#131d31" stroke="#334155" stroke-width="1"/>
      <text x="90" y="18" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle">KORELASI POPULASI</text>
      <text x="90" y="34" fill="#10b981" font-size="13" font-weight="800" text-anchor="middle">r = +0.47 (p &lt; 0.001)</text>
    </g>
  </g>

  <!-- Left Column: Empirical Scatter Plot & Province Comparison -->
  <g transform="translate(50, 98)">
    <rect x="0" y="0" width="580" height="525" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" filter="url(#cardShadow5)"/>

    <text x="24" y="34" fill="#ffffff" font-size="14" font-weight="700">Scatter Plot: Kepadatan Penduduk vs Rata-Rata Kasus Tahunan</text>
    <text x="24" y="52" fill="#94a3b8" font-size="11">Data BPS Sensus Penduduk 2020 (jiwa/km²) vs Kasus DBD Kemenkes RI (34 Provinsi)</text>

    <!-- Legend -->
    <g transform="translate(24, 72)">
      <circle cx="6" cy="8" r="5" fill="#10b981"/>
      <text x="18" y="12" fill="#e2e8f0" font-size="11">Provinsi Indonesia</text>

      <line x1="160" y1="8" x2="185" y2="8" stroke="#38bdf8" stroke-width="2"/>
      <text x="195" y="12" fill="#7dd3fc" font-size="11">Garis Tren Regresi (r = +0.47)</text>

      <circle cx="370" cy="8" r="5" fill="#f43f5e"/>
      <text x="382" y="12" fill="#fca5a5" font-size="11">Pulau Jawa (Episentrum)</text>
    </g>

    <!-- Chart Area (Width: 490, Height: 210, Baseline Y: 210) -->
    <!-- X-Axis: Kepadatan 0 to 1.600 jiwa/km² (DKI di-inset skala terpisah) -->
    <!-- Y-Axis: Kasus 0 to 40.000 jiwa -->
    <g transform="translate(45, 105)">
      <!-- Grid lines -->
      <line x1="0" y1="210" x2="490" y2="210" stroke="#334155" stroke-width="1"/>
      <line x1="0" y1="157" x2="490" y2="157" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="0" y1="105" x2="490" y2="105" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="0" y1="52" x2="490" y2="52" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="0" y1="0" x2="490" y2="0" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>

      <!-- X-Axis Labels (Kepadatan jiwa/km²) -->
      <!-- Scale: 490px / 1600 = 0.306 px per unit -->
      <text x="0" y="228" fill="#64748b" font-size="9.5" text-anchor="middle">0</text>
      <text x="122" y="228" fill="#64748b" font-size="9.5" text-anchor="middle">400</text>
      <text x="245" y="228" fill="#64748b" font-size="9.5" text-anchor="middle">800</text>
      <text x="367" y="228" fill="#64748b" font-size="9.5" text-anchor="middle">1.200</text>
      <text x="475" y="228" fill="#10b981" font-size="9.5" font-weight="700" text-anchor="middle">1.600 jiwa/km²</text>

      <!-- Y-Axis Left (Cases: 0 to 40k) -->
      <!-- Scale: 210px / 40000 = 0.00525 px per kasus -->
      <text x="-10" y="214" fill="#64748b" font-size="9.5" text-anchor="end">0</text>
      <text x="-10" y="161" fill="#64748b" font-size="9.5" text-anchor="end">10k</text>
      <text x="-10" y="109" fill="#64748b" font-size="9.5" text-anchor="end">20k</text>
      <text x="-10" y="56" fill="#64748b" font-size="9.5" text-anchor="end">30k</text>
      <text x="-10" y="4" fill="#f43f5e" font-size="9.5" font-weight="700" text-anchor="end">40k Kasus</text>

      <!-- Trend Line (from 0, 200 to 460, 40) -->
      <line x1="10" y1="200" x2="470" y2="35" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3"/>

      <!-- Data Points (34 Provinsi) -->
      <!-- Papua (density 11, cases 400) -> x=3, y=208 -->
      <circle cx="10" cy="208" r="4" fill="#10b981"/>
      <text x="18" y="206" fill="#94a3b8" font-size="8.5">Papua (11)</text>

      <!-- Kaltim (density 30, cases 6200) -> x=10, y=177 -->
      <circle cx="15" cy="177" r="4.5" fill="#10b981"/>
      <text x="24" y="174" fill="#94a3b8" font-size="8.5">Kaltim</text>

      <!-- Sulsel (density 195, cases 7800) -> x=60, y=169 -->
      <circle cx="60" cy="169" r="4.5" fill="#10b981"/>
      <text x="68" y="165" fill="#94a3b8" font-size="8.5">Sulsel</text>

      <!-- Sumut (density 205, cases 9200) -> x=63, y=162 -->
      <circle cx="63" cy="162" r="4.5" fill="#10b981"/>

      <!-- Bali (density 750, cases 12000) -> x=230, y=147 -->
      <circle cx="230" cy="147" r="5" fill="#10b981"/>
      <text x="238" y="145" fill="#a7f3d0" font-size="8.5" font-weight="600">Bali (750)</text>

      <!-- Jatim (density 830, cases 22000) -> x=254, y=94 -->
      <circle cx="254" cy="94" r="6" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5"/>
      <text x="264" y="90" fill="#fca5a5" font-size="9" font-weight="700">Jatim (~22k)</text>

      <!-- Jateng (density 1050, cases 18500) -> x=321, y=113 -->
      <circle cx="321" cy="113" r="6" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5"/>
      <text x="331" y="110" fill="#fca5a5" font-size="9" font-weight="700">Jateng (~18.5k)</text>

      <!-- Jabar (density 1350, cases 35000) -> x=413, y=26 -->
      <circle cx="413" cy="26" r="7" fill="#f43f5e" stroke="#ffffff" stroke-width="2"/>
      <text x="405" y="12" fill="#ffffff" font-size="9.5" font-weight="800" text-anchor="middle">Jabar (~35k Kasus)</text>

      <!-- Inset Badge for DKI Jakarta (Terpadat tapi Sanitasi Lebih Baik) -->
      <g transform="translate(300, 150)">
        <rect x="0" y="0" width="180" height="48" rx="6" fill="#131d31" stroke="#334155" stroke-width="1"/>
        <text x="8" y="16" fill="#fca5a5" font-size="8.5" font-weight="700">📌 DKI Jakarta (Outlier Urban):</text>
        <text x="8" y="30" fill="#94a3b8" font-size="8">15.900 jiwa/km² | Kasus ~8.500</text>
        <text x="8" y="42" fill="#64748b" font-size="8">Faskes &amp; sanitasi menekan insidens/100k</text>
      </g>
    </g>

    <!-- Bottom Explanation Box -->
    <g transform="translate(24, 385)">
      <rect x="0" y="0" width="532" height="115" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="22" fill="#10b981" font-size="11" font-weight="700">Fakta Kunci Pengaruh Kepadatan Penduduk:</text>
      <text x="16" y="42" fill="#e2e8f0" font-size="11">• <tspan fill="#10b981" font-weight="700">Probabilitas Kontak:</tspan> Nyamuk Aedes betina terbang dalam radius sempit (&lt;100 meter).</text>
      <text x="16" y="62" fill="#e2e8f0" font-size="11">• Di pemukiman rapat (Jawa Barat &amp; Jawa Timur), 1 nyamuk menulari beberapa tetangga sekaligus.</text>
      <text x="16" y="86" fill="#cbd5e1" font-size="10.5">Implikasi Teknis: Kepadatan penduduk diintegrasikan sebagai <tspan fill="#ffffff" font-weight="700">Population Offset (log pop)</tspan> dalam pemodelan Poisson/Negative Binomial.</text>
    </g>
  </g>

  <!-- Right Column: Transmission Mechanics & BPJS Policies -->
  <g transform="translate(650, 98)">
    <rect x="0" y="0" width="580" height="525" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" filter="url(#cardShadow5)"/>

    <text x="24" y="34" fill="#ffffff" font-size="14" font-weight="700">Mekanisme Transmisi Urban &amp; Alokasi Sumber Daya</text>
    <text x="24" y="52" fill="#94a3b8" font-size="11">Karakteristik penularan di lingkungan perkotaan berdensitas tinggi</text>

    <!-- 3 Step Cards -->
    <g transform="translate(24, 70)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="532" height="85" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
        <circle cx="24" cy="24" r="12" fill="#1e293b"/>
        <text x="24" y="28" fill="#10b981" font-size="11" font-weight="800" text-anchor="middle">1</text>
        <text x="46" y="24" fill="#ffffff" font-size="12" font-weight="700">Tingginya Laju Kontak Vektor-Inang (Vector-Host Contact Rate)</text>
        <text x="46" y="44" fill="#94a3b8" font-size="11">Jarak antar rumah yang berdempetan memungkinkan nyamuk berpindah inang tanpa</text>
        <text x="46" y="60" fill="#e2e8f0" font-size="11">perlu terbang jauh, melipatgandakan tingkat reproduksi efektif virus (R0 &gt; 2.5).</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 97)">
        <rect x="0" y="0" width="532" height="85" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
        <circle cx="24" cy="24" r="12" fill="#1e293b"/>
        <text x="24" y="28" fill="#10b981" font-size="11" font-weight="800" text-anchor="middle">2</text>
        <text x="46" y="24" fill="#ffffff" font-size="12" font-weight="700">Proliferasi Tempat Perindukan Buatan (Artificial Breeding Sites)</text>
        <text x="46" y="44" fill="#94a3b8" font-size="11">Pemukiman padat menghasilkan limpahan kontainer plastik, talang air mampet, dan</text>
        <text x="46" y="60" fill="#94a3b8" font-size="11">penampungan air darurat yang menjadi habitat ideal bertelurnya Aedes aegypti.</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 194)">
        <rect x="0" y="0" width="532" height="85" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
        <circle cx="24" cy="24" r="12" fill="#10b981" font-size="11" font-weight="800" text-anchor="middle">3</circle>
        <text x="46" y="24" fill="#ffffff" font-size="12" font-weight="700">Formulasi Matematis DengueCast: Population Offset</text>
        <text x="46" y="44" fill="#94a3b8" font-size="11">Kasus dimodelkan sebagai insidens: log(μ_it) = log(Pop_it) + β·Iklim_it + γ·Y_(t-1).</text>
        <text x="46" y="60" fill="#cbd5e1" font-size="11">Kepadatan penduduk menstandarkan peramalan per 100.000 jiwa agar adil antar provinsi.</text>
      </g>
    </g>

    <!-- Actionable Healthcare Policy Box -->
    <g transform="translate(24, 385)">
      <rect x="0" y="0" width="532" height="115" rx="8" fill="#131d31" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" fill="#10b981" font-size="11" font-weight="700">Implikasi Manajemen Risiko BPJS Kesehatan &amp; Dinkes:</text>
      <text x="16" y="44" fill="#e2e8f0" font-size="11">1. <tspan font-weight="700" fill="#ffffff">Prioritas Alokasi Cadangan Klaim:</tspan> Jawa Barat, Jawa Timur, dan Jawa Tengah menyerap &gt;50% anggaran.</text>
      <text x="16" y="64" fill="#e2e8f0" font-size="11">2. <tspan font-weight="700" fill="#ffffff">Intervensi Berbasis Klaster RW:</tspan> Larvasidasi fokus di kawasan padat kumuh sebelum musim hujan.</text>
      <text x="16" y="86" fill="#94a3b8" font-size="10.5">Status Fitur: <tspan fill="#10b981" font-weight="700">Population Offset Wajib</tspan> untuk menormalkan variansi Poisson/NegBin.</text>
    </g>
  </g>
</svg>
