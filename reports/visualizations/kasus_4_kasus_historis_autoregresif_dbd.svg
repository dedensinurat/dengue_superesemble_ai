<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" style="background: #090d16; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Card & Element Styles -->
    <linearGradient id="barActiveGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Clean Background -->
  <rect width="1280" height="720" fill="#090d16"/>

  <!-- Subtle Clean Header Divider Line -->
  <line x1="50" y1="82" x2="1230" y2="82" stroke="#1e293b" stroke-width="1"/>

  <!-- ================= TOP HEADER ================= -->
  <g transform="translate(50, 24)">
    <!-- Small Category Tag -->
    <text x="0" y="14" fill="#f59e0b" font-size="11" font-weight="700" letter-spacing="1">DENGUECAST • ANALISIS VARIABEL UTAMA (STUDI KASUS 4)</text>

    <!-- Main Title -->
    <text x="0" y="40" fill="#ffffff" font-size="22" font-weight="700">Kasus Historis (Autoregresif) &amp; Efek Bola Salju Penularan Urban</text>
    <text x="0" y="58" fill="#94a3b8" font-size="12">Bukti Empiris: Mengapa Penderita Aktif Bulan Lalu Menjadi Prediktor No. 1 Terkuat di Pemukiman Padat</text>

    <!-- Clean Metric Pill Right -->
    <g transform="translate(1000, 2)">
      <rect x="0" y="0" width="180" height="42" rx="8" fill="#131d31" stroke="#334155" stroke-width="1"/>
      <text x="90" y="18" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle">KORELASI AUTOREGRESIF</text>
      <text x="90" y="34" fill="#fbbf24" font-size="13" font-weight="800" text-anchor="middle">r = +0.78 (Terkuat)</text>
    </g>
  </g>

  <!-- ================= LEFT COLUMN: CLEAN COMPARISON CHART ================= -->
  <g transform="translate(50, 98)">
    <!-- Card Container -->
    <rect x="0" y="0" width="580" height="525" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" filter="url(#cardShadow)"/>

    <!-- Card Header -->
    <text x="24" y="34" fill="#ffffff" font-size="14" font-weight="700">Simulasi Komparasi: Peran Reservoir Virus pada Iklim Serupa</text>
    <text x="24" y="52" fill="#94a3b8" font-size="11">Dua skenario di wilayah urban padat dengan kondisi cuaca dan populasi nyamuk 100% identik</text>

    <!-- Clean Legend -->
    <g transform="translate(24, 72)">
      <rect x="0" y="3" width="14" height="10" rx="2" fill="#f59e0b"/>
      <text x="20" y="12" fill="#e2e8f0" font-size="11">Dengan Reservoir (Bulan t-1 = 500 kasus)</text>

      <rect x="290" y="3" width="14" height="10" rx="2" fill="#334155"/>
      <text x="310" y="12" fill="#94a3b8" font-size="11">Tanpa Reservoir (Bulan t-1 = 30 kasus)</text>
    </g>

    <!-- CHART AREA (Width: 500, Height: 210, Baseline Y: 220) -->
    <!-- Max Value = 2.500 kasus, Scale = 200px / 2.500 = 0.08 px/kasus -->
    <g transform="translate(50, 105)">
      <!-- Grid lines -->
      <line x1="0" y1="210" x2="480" y2="210" stroke="#334155" stroke-width="1"/>
      <line x1="0" y1="168" x2="480" y2="168" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="0" y1="126" x2="480" y2="126" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="0" y1="84" x2="480" y2="84" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="0" y1="42" x2="480" y2="42" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="0" y1="0" x2="480" y2="0" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>

      <!-- Y-Axis Labels -->
      <text x="-12" y="214" fill="#64748b" font-size="10" text-anchor="end">0</text>
      <text x="-12" y="172" fill="#64748b" font-size="10" text-anchor="end">500</text>
      <text x="-12" y="130" fill="#64748b" font-size="10" text-anchor="end">1.000</text>
      <text x="-12" y="88" fill="#64748b" font-size="10" text-anchor="end">1.500</text>
      <text x="-12" y="46" fill="#64748b" font-size="10" text-anchor="end">2.000</text>
      <text x="-12" y="4" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="end">2.500</text>

      <!-- BARS GROUP 1: BULAN t-1 -->
      <!-- Center = 60 -->
      <g transform="translate(60, 0)">
        <!-- Bar Reservoir: 500 kasus -> h = 40px, y = 170 -->
        <rect x="-24" y="170" width="22" height="40" rx="3" fill="url(#barActiveGrad)"/>
        <text x="-13" y="163" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">500</text>

        <!-- Bar Bersih: 30 kasus -> h = 3px, y = 207 -->
        <rect x="2" y="207" width="22" height="3" rx="1.5" fill="#334155"/>
        <text x="13" y="201" fill="#64748b" font-size="9.5" text-anchor="middle">30</text>

        <text x="0" y="230" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Bulan t-1</text>
        <text x="0" y="244" fill="#64748b" font-size="9.5" text-anchor="middle">Fase Awal</text>
      </g>

      <!-- BARS GROUP 2: BULAN t -->
      <!-- Center = 180 -->
      <g transform="translate(180, 0)">
        <!-- Bar Reservoir: 1.100 kasus -> h = 88px, y = 122 -->
        <rect x="-24" y="122" width="22" height="88" rx="3" fill="url(#barActiveGrad)"/>
        <text x="-13" y="115" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">1.100</text>

        <!-- Bar Bersih: 80 kasus -> h = 7px, y = 203 -->
        <rect x="2" y="203" width="22" height="7" rx="2" fill="#334155"/>
        <text x="13" y="197" fill="#64748b" font-size="9.5" text-anchor="middle">80</text>

        <text x="0" y="230" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Bulan t</text>
        <text x="0" y="244" fill="#64748b" font-size="9.5" text-anchor="middle">+1 Bulan</text>
      </g>

      <!-- BARS GROUP 3: BULAN t+1 (PUNCAK) -->
      <!-- Center = 300 -->
      <g transform="translate(300, 0)">
        <!-- Bar Reservoir: 1.950 kasus -> h = 156px, y = 54 -->
        <rect x="-24" y="54" width="22" height="156" rx="3" fill="url(#barActiveGrad)"/>
        <!-- Value Label with clean badge -->
        <rect x="-42" y="30" width="58" height="18" rx="4" fill="#78350f" stroke="#d97706" stroke-width="1"/>
        <text x="-13" y="43" fill="#fef08a" font-size="10" font-weight="800" text-anchor="middle">1.950 KLB</text>

        <!-- Bar Bersih: 120 kasus -> h = 10px, y = 200 -->
        <rect x="2" y="200" width="22" height="10" rx="2" fill="#334155"/>
        <text x="13" y="193" fill="#64748b" font-size="9.5" text-anchor="middle">120</text>

        <text x="0" y="230" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="middle">Bulan t+1</text>
        <text x="0" y="244" fill="#fbbf24" font-size="9.5" font-weight="600" text-anchor="middle">Puncak Wabah</text>
      </g>

      <!-- BARS GROUP 4: BULAN t+2 -->
      <!-- Center = 420 -->
      <g transform="translate(420, 0)">
        <!-- Bar Reservoir: 1.200 kasus -> h = 96px, y = 114 -->
        <rect x="-24" y="114" width="22" height="96" rx="3" fill="url(#barActiveGrad)"/>
        <text x="-13" y="107" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">1.200</text>

        <!-- Bar Bersih: 60 kasus -> h = 5px, y = 205 -->
        <rect x="2" y="205" width="22" height="5" rx="2" fill="#334155"/>
        <text x="13" y="199" fill="#64748b" font-size="9.5" text-anchor="middle">60</text>

        <text x="0" y="230" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Bulan t+2</text>
        <text x="0" y="244" fill="#64748b" font-size="9.5" text-anchor="middle">Pasca Puncak</text>
      </g>
    </g>

    <!-- CLEAN BOTTOM EXPLANATION BOX -->
    <g transform="translate(24, 385)">
      <rect x="0" y="0" width="532" height="115" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="22" fill="#f59e0b" font-size="11" font-weight="700">Temuan Kunci Dinamika di Atas:</text>
      <text x="16" y="42" fill="#e2e8f0" font-size="11">• Kota dengan 500 penderita aktif bulan lalu melonjak <tspan fill="#f59e0b" font-weight="700">hampir 4x lipat (1.950 kasus)</tspan>.</text>
      <text x="16" y="62" fill="#e2e8f0" font-size="11">• Kota tanpa penderita aktif tetap tenang (&lt;120 kasus) <tspan fill="#94a3b8">meski cuaca &amp; populasi nyamuk sama</tspan>.</text>
      <text x="16" y="86" fill="#cbd5e1" font-size="10.5">Kesimpulan: Iklim menyediakan kondisi ramah vektor, <tspan fill="#ffffff" font-weight="700">namun keberadaan virus pada manusia adalah pemicu utama transmisi</tspan>.</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: TRANSMISSION MECHANISM & MODEL SOLUTION ================= -->
  <g transform="translate(650, 98)">
    <!-- Card Container -->
    <rect x="0" y="0" width="580" height="525" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" filter="url(#cardShadow)"/>

    <!-- Card Header -->
    <text x="24" y="34" fill="#ffffff" font-size="14" font-weight="700">Mekanisme Kausalitas &amp; Formula Rekursif Model</text>
    <text x="24" y="52" fill="#94a3b8" font-size="11">Bagaimana DengueCast menangkap inersia epidemiologis tanpa data leakage</text>

    <!-- 3 STEP CLEAN CARDS -->
    <g transform="translate(24, 70)">
      <!-- STEP 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="532" height="85" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
        <circle cx="24" cy="24" r="12" fill="#1e293b"/>
        <text x="24" y="28" fill="#f59e0b" font-size="11" font-weight="800" text-anchor="middle">1</text>
        <text x="46" y="24" fill="#ffffff" font-size="12" font-weight="700">Manusia Sebagai Satu-Satunya Reservoir Aktif</text>
        <text x="46" y="44" fill="#94a3b8" font-size="11">Nyamuk Aedes tidak terlahir membawa dengue. Nyamuk hanya menjadi infektif</text>
        <text x="46" y="60" fill="#94a3b8" font-size="11">jika menghisap darah pasien saat fase demam viremia (hari 1–5).</text>
      </g>

      <!-- STEP 2 -->
      <g transform="translate(0, 97)">
        <rect x="0" y="0" width="532" height="85" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
        <circle cx="24" cy="24" r="12" fill="#1e293b"/>
        <text x="24" y="28" fill="#f59e0b" font-size="11" font-weight="800" text-anchor="middle">2</text>
        <text x="46" y="24" fill="#ffffff" font-size="12" font-weight="700">Efek Pengganda di Wilayah Urban Padat</text>
        <text x="46" y="44" fill="#94a3b8" font-size="11">Dalam radius terbang nyamuk (50–100 meter), 1 pasien aktif dapat menjadi sumber</text>
        <text x="46" y="60" fill="#94a3b8" font-size="11">penularan bagi puluhan nyamuk baru, memicu efek bola salju satu RT/RW.</text>
      </g>

      <!-- STEP 3 -->
      <g transform="translate(0, 194)">
        <rect x="0" y="0" width="532" height="95" rx="8" fill="#131d31" stroke="#334155" stroke-width="1"/>
        <circle cx="24" cy="24" r="12" fill="#1e293b"/>
        <text x="24" y="28" fill="#f59e0b" font-size="11" font-weight="800" text-anchor="middle">3</text>
        <text x="46" y="24" fill="#ffffff" font-size="12" font-weight="700">Solusi Matematis: Rekursi Lag M0 Tanpa Kebocoran</text>
        <text x="46" y="44" fill="#94a3b8" font-size="11">Untuk lead 1 bulan (h=1), model menggunakan kasus observasi riil (Y_t).</text>
        <text x="46" y="60" fill="#94a3b8" font-size="11">Untuk lead horizon jauh (h ≥ 2), proyeksi bulan sebelumnya dioper secara rekursif</text>
        <text x="46" y="76" fill="#cbd5e1" font-size="10.5">guna menjamin prediksi multi-bulan bebas dari kebocoran data masa depan.</text>
      </g>
    </g>

    <!-- ACTIONABLE HEALTHCARE POLICY BOX -->
    <g transform="translate(24, 385)">
      <rect x="0" y="0" width="532" height="115" rx="8" fill="#131d31" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" fill="#f59e0b" font-size="11" font-weight="700">Implikasi Strategis Pelayanan Primer &amp; BPJS Kesehatan:</text>
      <text x="16" y="44" fill="#e2e8f0" font-size="11">1. <tspan font-weight="700" fill="#ffffff">Isolasi Gigitan di FKTP:</tspan> Pasien suspek demam hari 1–3 di Puskesmas harus dilindungi</text>
      <text x="32" y="60" fill="#94a3b8" font-size="10.5">kelambu atau repelan agar tidak digigit nyamuk yang dapat menulari tetangga.</text>
      <text x="16" y="80" fill="#e2e8f0" font-size="11">2. <tspan font-weight="700" fill="#ffffff">Efisiensi Biaya BPJS:</tspan> Memutus 1 kasus viremia di tingkat primer secara langsung</text>
      <text x="32" y="96" fill="#94a3b8" font-size="10.5">mencegah potensi rawat inap 3–5 pasien DBD di rumah sakit pada bulan berikutnya.</text>
    </g>
  </g>

  <!-- ================= BOTTOM STATUS FOOTER ================= -->
  <g transform="translate(50, 638)">
    <rect x="0" y="0" width="1180" height="52" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="22" fill="#f59e0b" font-size="11" font-weight="700">Rangkuman Arsitektur Model DengueCast:</text>
    <text x="20" y="39" fill="#94a3b8" font-size="11">Model mengintegrasikan komponen autoregresif (daya dorong penderita aktif) dengan variabel iklim eksogen menggunakan skema <tspan fill="#e2e8f0" font-weight="600">Superensemble berbobot 1/CRPS²</tspan>, menghasilkan akurasi prakiraan probabilistik yang stabil dan terkalibrasi.</text>
  </g>
</svg>
