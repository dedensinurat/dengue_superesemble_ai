<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" style="background: #090d16; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="oniBarCleanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <filter id="cardShadow2" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Clean Background -->
  <rect width="1280" height="720" fill="#090d16"/>

  <!-- Subtle Header Divider -->
  <line x1="50" y1="82" x2="1230" y2="82" stroke="#1e293b" stroke-width="1"/>

  <!-- ================= TOP HEADER ================= -->
  <g transform="translate(50, 24)">
    <text x="0" y="14" fill="#f43f5e" font-size="11" font-weight="700" letter-spacing="1">DENGUECAST • ANALISIS VARIABEL UTAMA (STUDI KASUS 2)</text>
    <text x="0" y="40" fill="#ffffff" font-size="22" font-weight="700">Pengaruh Suhu Hangat &amp; Anomali El Niño terhadap Ledakan Epidemi</text>
    <text x="0" y="58" fill="#94a3b8" font-size="12">Bukti Empiris: Mengapa Rekor KLB Nasional Meletus Serentak di Tahun Super El Niño (2016: 204k Kasus &amp; 2024: 244k Kasus)</text>

    <!-- Clean Metric Pill Right -->
    <g transform="translate(1000, 2)">
      <rect x="0" y="0" width="180" height="42" rx="8" fill="#131d31" stroke="#334155" stroke-width="1"/>
      <text x="90" y="18" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle">KORELASI TAHUNAN NASIONAL</text>
      <text x="90" y="34" fill="#f43f5e" font-size="13" font-weight="800" text-anchor="middle">Spearman ρ = +0.83</text>
    </g>
  </g>

  <!-- ================= LEFT COLUMN: EMPIRICAL TIMELINE CHART ================= -->
  <g transform="translate(50, 98)">
    <rect x="0" y="0" width="580" height="525" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" filter="url(#cardShadow2)"/>

    <text x="24" y="34" fill="#ffffff" font-size="14" font-weight="700">Sinkronisasi Iklim Global vs Kasus Tahunan (2010–2024)</text>
    <text x="24" y="52" fill="#94a3b8" font-size="11">Data historis Kemenkes RI &amp; OpenDengue v1.3 vs NOAA Oceanic Niño Index (ONI)</text>

    <!-- Legend -->
    <g transform="translate(24, 72)">
      <rect x="0" y="3" width="14" height="10" rx="2" fill="#f43f5e"/>
      <text x="20" y="12" fill="#e2e8f0" font-size="11">Tahun El Niño Hangat</text>

      <rect x="180" y="3" width="14" height="10" rx="2" fill="#334155"/>
      <text x="200" y="12" fill="#94a3b8" font-size="11">Tahun Netral / La Niña</text>

      <line x1="370" y1="8" x2="390" y2="8" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 2"/>
      <text x="398" y="12" fill="#7dd3fc" font-size="11">Anomali Suhu Pasifik</text>
    </g>

    <!-- CHART AREA (Width: 490, Height: 210, Baseline Y: 210) -->
    <!-- Max cases = 260.000, Scale = 200px / 260k = 0.00077 px/kasus -->
    <g transform="translate(45, 105)">
      <!-- Grid lines -->
      <line x1="0" y1="210" x2="490" y2="210" stroke="#334155" stroke-width="1"/>
      <line x1="0" y1="157" x2="490" y2="157" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="0" y1="105" x2="490" y2="105" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="0" y1="52" x2="490" y2="52" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="0" y1="0" x2="490" y2="0" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>

      <!-- Y-Axis Labels -->
      <text x="-10" y="214" fill="#64748b" font-size="9.5" text-anchor="end">0</text>
      <text x="-10" y="161" fill="#64748b" font-size="9.5" text-anchor="end">65k</text>
      <text x="-10" y="109" fill="#64748b" font-size="9.5" text-anchor="end">130k</text>
      <text x="-10" y="56" fill="#64748b" font-size="9.5" text-anchor="end">195k</text>
      <text x="-10" y="4" fill="#f43f5e" font-size="9.5" font-weight="700" text-anchor="end">260k Kasus</text>

      <!-- BARS: 8 TIMELINE POINTS (dx = 61px) -->
      <!-- '10 (El Nino): 156k (h=120, y=90) -->
      <g transform="translate(25, 0)">
        <rect x="-12" y="90" width="24" height="120" rx="3" fill="url(#oniBarCleanGrad)" opacity="0.8"/>
        <text x="0" y="83" fill="#cbd5e1" font-size="9.5" font-weight="600" text-anchor="middle">156k</text>
        <text x="0" y="228" fill="#64748b" font-size="10" text-anchor="middle">'10</text>
      </g>

      <!-- '12 (Netral): 90k (h=69, y=141) -->
      <g transform="translate(86, 0)">
        <rect x="-12" y="141" width="24" height="69" rx="3" fill="#334155"/>
        <text x="0" y="135" fill="#64748b" font-size="9.5" text-anchor="middle">90k</text>
        <text x="0" y="228" fill="#64748b" font-size="10" text-anchor="middle">'12</text>
      </g>

      <!-- '14 (Netral): 100k (h=77, y=133) -->
      <g transform="translate(147, 0)">
        <rect x="-12" y="133" width="24" height="77" rx="3" fill="#334155"/>
        <text x="0" y="127" fill="#64748b" font-size="9.5" text-anchor="middle">100k</text>
        <text x="0" y="228" fill="#64748b" font-size="10" text-anchor="middle">'14</text>
      </g>

      <!-- '16 (SUPER EL NINO): 204k (h=157, y=53) -->
      <g transform="translate(208, 0)">
        <rect x="-12" y="53" width="24" height="157" rx="3" fill="url(#oniBarCleanGrad)"/>
        <!-- Clean Badge -->
        <rect x="-32" y="28" width="64" height="18" rx="4" fill="#881337" stroke="#e11d48" stroke-width="1"/>
        <text x="0" y="41" fill="#ffffff" font-size="9.5" font-weight="800" text-anchor="middle">204k KLB</text>
        <text x="0" y="228" fill="#f43f5e" font-size="10.5" font-weight="800" text-anchor="middle">'16</text>
      </g>

      <!-- '17 (Pasca El Nino Drop): 68k (h=52, y=158) -->
      <g transform="translate(269, 0)">
        <rect x="-12" y="158" width="24" height="52" rx="3" fill="#1e293b"/>
        <text x="0" y="152" fill="#64748b" font-size="9.5" text-anchor="middle">68k</text>
        <text x="0" y="228" fill="#64748b" font-size="10" text-anchor="middle">'17</text>
      </g>

      <!-- '19 (El Nino Sedang): 138k (h=106, y=104) -->
      <g transform="translate(330, 0)">
        <rect x="-12" y="104" width="24" height="106" rx="3" fill="url(#oniBarCleanGrad)" opacity="0.8"/>
        <text x="0" y="97" fill="#cbd5e1" font-size="9.5" font-weight="600" text-anchor="middle">138k</text>
        <text x="0" y="228" fill="#64748b" font-size="10" text-anchor="middle">'19</text>
      </g>

      <!-- '21 (La Nina Basah): 73k (h=56, y=154) -->
      <g transform="translate(391, 0)">
        <rect x="-12" y="154" width="24" height="56" rx="3" fill="#1e293b"/>
        <text x="0" y="148" fill="#64748b" font-size="9.5" text-anchor="middle">73k</text>
        <text x="0" y="228" fill="#64748b" font-size="10" text-anchor="middle">'21</text>
      </g>

      <!-- '24 (SUPER EL NINO REKOR): 244k (h=188, y=22) -->
      <g transform="translate(452, 0)">
        <rect x="-14" y="22" width="28" height="188" rx="3" fill="url(#oniBarCleanGrad)"/>
        <!-- Clean Badge -->
        <rect x="-38" y="-4" width="76" height="20" rx="4" fill="#881337" stroke="#e11d48" stroke-width="1"/>
        <text x="0" y="10" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">244k REKOR</text>
        <text x="0" y="228" fill="#f43f5e" font-size="10.5" font-weight="800" text-anchor="middle">'24</text>
      </g>

      <!-- ONI Index smooth curve overlay -->
      <path d="M 25 80 Q 55 170 86 185 T 147 160 Q 177 40 208 40 T 269 195 Q 300 130 330 115 T 391 190 Q 421 30 452 30"
            fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3"/>
    </g>

    <!-- CLEAN BOTTOM EXPLANATION BOX -->
    <g transform="translate(24, 385)">
      <rect x="0" y="0" width="532" height="115" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="22" fill="#f43f5e" font-size="11" font-weight="700">Analisis Siklus Iklim Global:</text>
      <text x="16" y="42" fill="#e2e8f0" font-size="11">• <tspan fill="#ffffff" font-weight="700">Tahun 2016 &amp; 2024</tspan> adalah fase Super El Niño terkuat abad ini (+2.2°C &amp; +2.0°C).</text>
      <text x="16" y="62" fill="#e2e8f0" font-size="11">• Kedua tahun tersebut menghasilkan <tspan fill="#f43f5e" font-weight="700">rekor kasus nasional tertinggi</tspan> (&gt;200.000 kasus).</text>
      <text x="16" y="86" fill="#cbd5e1" font-size="10.5">Kesimpulan: Variabel iklim global adalah <tspan fill="#38bdf8" font-weight="700">regulator skala keparahan epidemi tahunan</tspan> di 34 provinsi.</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: CLEAN BIOLOGICAL MECHANISM ================= -->
  <g transform="translate(650, 98)">
    <rect x="0" y="0" width="580" height="525" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" filter="url(#cardShadow2)"/>

    <text x="24" y="34" fill="#ffffff" font-size="14" font-weight="700">Mekanisme Kausalitas Suhu Hangat terhadap Vektor</text>
    <text x="24" y="52" fill="#94a3b8" font-size="11">Bagaimana kenaikan suhu 1°C menggandakan kecepatan penularan virus</text>

    <!-- 3 STEP CLEAN CARDS -->
    <g transform="translate(24, 70)">
      <!-- STEP 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="532" height="85" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
        <circle cx="24" cy="24" r="12" fill="#1e293b"/>
        <text x="24" y="28" fill="#f43f5e" font-size="11" font-weight="800" text-anchor="middle">1</text>
        <text x="46" y="24" fill="#ffffff" font-size="12" font-weight="700">Pemendekan Masa Inkubasi Ekstrinsik (EIP) Virus</text>
        <text x="46" y="44" fill="#94a3b8" font-size="11">Pada suhu normal (26°C), EIP virus di nyamuk butuh 14 hari. Pada suhu hangat El Niño</text>
        <text x="46" y="60" fill="#e2e8f0" font-size="11">(29°C–31°C), masa EIP terpangkas jadi <tspan fill="#f43f5e" font-weight="700">hanya 7 hari (virus matang 2x lebih cepat)</tspan>.</text>
      </g>

      <!-- STEP 2 -->
      <g transform="translate(0, 97)">
        <rect x="0" y="0" width="532" height="85" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
        <circle cx="24" cy="24" r="12" fill="#1e293b"/>
        <text x="24" y="28" fill="#f43f5e" font-size="11" font-weight="800" text-anchor="middle">2</text>
        <text x="46" y="24" fill="#ffffff" font-size="12" font-weight="700">Peningkatan Frekuensi Gigitan Nyamuk Betina</text>
        <text x="46" y="44" fill="#94a3b8" font-size="11">Cuaca panas mempercepat metabolisme pencernaan darah nyamuk. Siklus bertelur</text>
        <text x="46" y="60" fill="#e2e8f0" font-size="11">memendek dari 4 hari jadi 2 hari <tspan fill="#f43f5e" font-weight="700">→ nyamuk menggigit 2x lebih sering</tspan>.</text>
      </g>

      <!-- STEP 3 -->
      <g transform="translate(0, 194)">
        <rect x="0" y="0" width="532" height="85" rx="8" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
        <circle cx="24" cy="24" r="12" fill="#1e293b"/>
        <text x="24" y="28" fill="#f43f5e" font-size="11" font-weight="800" text-anchor="middle">3</text>
        <text x="46" y="24" fill="#ffffff" font-size="12" font-weight="700">Penampungan Air Bersih Saat Kemarau Panjang</text>
        <text x="46" y="44" fill="#94a3b8" font-size="11">Kekeringan akibat El Niño mendorong masyarakat menampung air di ember dan drum terbuka,</text>
        <text x="46" y="60" fill="#94a3b8" font-size="11">menciptakan habitat perindukan nyamuk domestik di dalam rumah warga.</text>
      </g>
    </g>

    <!-- ACTIONABLE HEALTHCARE POLICY BOX -->
    <g transform="translate(24, 385)">
      <rect x="0" y="0" width="532" height="115" rx="8" fill="#131d31" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" fill="#f43f5e" font-size="11" font-weight="700">Nilai Strategis Peringatan Dini Iklim Bagi BPJS &amp; Faskes:</text>
      <text x="16" y="44" fill="#e2e8f0" font-size="11">1. <tspan font-weight="700" fill="#ffffff">Lead-Time 3 s/d 6 Bulan:</tspan> Anomali ONI terdeteksi jauh sebelum musim penularan dimulai,</text>
      <text x="32" y="60" fill="#94a3b8" font-size="10.5">memberi waktu bagi BPJS untuk mengantisipasi potensi lonjakan beban klaim faskes.</text>
      <text x="16" y="80" fill="#e2e8f0" font-size="11">2. <tspan font-weight="700" fill="#ffffff">Kesiapan Rantai Pasok:</tspan> Pengadaan cairan infus, alat uji cepat NS1, dan kesiapan ICU anak</text>
      <text x="32" y="96" fill="#94a3b8" font-size="10.5">dapat dipersiapkan di 34 provinsi sebelum kapasitas bed rawat inap terlampaui.</text>
    </g>
  </g>

  <!-- ================= BOTTOM STATUS FOOTER ================= -->
  <g transform="translate(50, 638)">
    <rect x="0" y="0" width="1180" height="52" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="22" fill="#f43f5e" font-size="11" font-weight="700">Integrasi Variabel Iklim Global dalam Model:</text>
    <text x="20" y="39" fill="#94a3b8" font-size="11">DengueCast menyematkan indeks iklim global (ONI &amp; DMI) ke dalam model peramalan probabilistik, memungkinkan sistem mendeteksi lonjakan risiko epidemi nasional <tspan fill="#e2e8f0" font-weight="600">beberapa kuartal lebih awal</tspan>.</text>
  </g>
</svg>
