[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "denguecast"
version = "0.1.0"
description = "Sistem peramalan DBD probabilistik - DengueCast"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14.0",
    "duckdb>=0.9",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.4",
    "pydantic-settings>=2.0",
    "typer>=0.9",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "streamlit>=1.28",
    "plotly>=5.18",
    "joblib>=1.3",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
geo = ["xarray>=2023.6", "rasterio>=1.3", "rasterstats>=0.19"]
network = ["httpx>=0.25", "cdsapi>=0.6"]
pdf = ["pdfplumber>=0.10"]
image = ["pillow>=10.0", "scikit-image>=0.22"]
bayes = ["pymc>=5.7"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.88",
    "ruff>=0.1",
    "mypy>=1.6",
    "httpx>=0.25",  # for FastAPI TestClient
]

[project.scripts]
denguecast = "denguecast.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
